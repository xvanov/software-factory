name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # GitHub merge queue: re-test each PR against the ACTUAL post-merge base
  # (main + everything ahead of it in the queue) before the merge lands. The
  # SAME job names (lint / typecheck / pytest) run here as on pull_request, so
  # the branch-protection required checks are real on the queue — a required
  # check that never triggered on merge_group would silently pass the queue
  # (the vacuous-required-check false-green). Kills "passed in isolation,
  # broke main". The queue (like push) runs the FULL suite — the fast lane is
  # a pull_request-only concession.
  merge_group:

permissions:
  contents: read

# ---------------------------------------------------------------------------
# E6 (operator decision 2026-08-09): the PR-BLOCKING lane must finish in
# under 60 seconds. Two lanes, one workflow:
#
#   pull_request  -> FAST lane: the suite MINUS tests/fast_lane_excludes.txt
#                    (hand-curated capability rule: boots a server / runs a
#                    sandbox or docker / parallelism-hostile subprocess
#                    spawners — never "it was slow"), parallel via
#                    pytest-xdist, no coverage. The 5-minute step timeout is
#                    the budget backstop if a heavy file goes unclassified.
#   push / queue  -> FULL suite with coverage (COVERAGE_CORE=sysmon), exactly
#                    what gated every merge before E6. Runs post-merge.
#
# RED-BLOCKS-MERGES IS NOT WIRED YET — deferred deliberately (stage 2), not
# forgotten. Adversarial review (2026-08-09) showed the naive version (a
# required `main-green` check failing while main's full lane is red) would
# make auto_merge's CI-failure handler burn a dev run per open PR and then
# CLOSE every chain PR and terminally park its story two ticks after main
# goes red. Stage 2 = the guard PLUS an auto_merge change that treats a red
# main-guard as a HOLD (wait, don't dispatch, don't park) PLUS a
# head-SHA-pinned query (newest-completed-run masks an older red one).
# UNTIL THEN: a red full lane on main must be fixed before anything else
# merges — operator-enforced. Do not turn the factory's unattended merging
# on while this interim holds.
#
# Manifest guards (tests/test_fast_lane_manifest.py, runs in the fast lane):
# stale entries fail; unlisted heavy files run slow-but-safe until the step
# timeout forces classification.
# ---------------------------------------------------------------------------

jobs:
  # ---------------------------------------------------------------------------
  # Decide whether this change can skip the build/test work.
  #
  # WHY THIS IS A JOB AND NOT `paths-ignore`:
  # `lint`, `typecheck` and `pytest` are REQUIRED status checks on `main`. A
  # workflow suppressed by `paths-ignore` never reports those contexts at all,
  # so GitHub leaves them "Expected — waiting for status" and the PR can never
  # merge. That is the same vacuous-required-check class the `merge_group`
  # comment above guards against, arrived at from the other direction.
  #
  # So the three jobs ALWAYS run and ALWAYS report. Only their expensive steps
  # are conditional. A docs-only PR costs ~20 s of runner time instead of ~4 min
  # and still satisfies branch protection.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      # E6: no checkout. This job sits on the critical path of every PR's
      # required checks, and a full-history checkout made it ~15 s; the PR
      # files API answers the same question in ~2 s. Pagination cap at 3
      # pages (300 files) resolves to fail-safe like every other branch.
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # FAIL SAFE. Every uncertain path resolves to "run everything".
          # A wrong `docs_only=true` is a false green on a required check —
          # strictly worse than a slow build.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "event=$EVENT_NAME (not a PR) -> full suite"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! CHANGED="$(gh api "repos/${REPO}/pulls/${PR}/files?per_page=100" \
              --paginate --jq '.[].filename' 2>/dev/null | head -301)"; then
            echo "could not list PR files -> full suite"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$CHANGED" ] || [ "$(echo "$CHANGED" | wc -l)" -gt 300 ]; then
            echo "empty or oversized diff -> full suite"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          # "Docs only" means EVERY changed path is a ROOT-LEVEL *.md file or
          # lives under docs/ (prose and archives; no test reads them).
          #
          # Deliberately narrow beyond that, because markdown in this repo is
          # often code:
          #   factory/personas/*.md   are prompts, covered by contract tests
          #                           (tests/handlers/test_prompt_contracts.py,
          #                            tests/test_persona_loader.py)
          #   apps/**/context/*.md    drive test_context_loader / canonical_paths
          #   apps/**/directions/*.md drive test_direction_parser
          # Those carve-outs must survive any future widening.
          if echo "$CHANGED" | grep -qvE '^([^/]+\.md|docs/.+\.md)$'; then
            echo "-> paths beyond root-markdown/docs present; full suite"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "-> root-level markdown / docs/ only; skipping build/test steps"
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip notice
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Root-level markdown only — ruff has nothing to check."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'
      - uses: astral-sh/setup-uv@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          enable-cache: true
          python-version: "3.12"
      - name: uv sync
        if: needs.changes.outputs.docs_only != 'true'
        run: uv sync --all-extras
      - name: ruff check
        if: needs.changes.outputs.docs_only != 'true'
        run: uv run ruff check factory/ tests/ bench/

  typecheck:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip notice
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Root-level markdown only — no Python changed."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'
      - uses: astral-sh/setup-uv@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          enable-cache: true
          python-version: "3.12"
      # E6: mypy is incremental — a warm .mypy_cache turns the package-wide
      # run from ~40 s of re-analysis into seconds. Keyed on the lockfile
      # (dependency stubs change the cache shape); restore-keys tolerates a
      # stale-but-mostly-valid cache, which mypy revalidates per module.
      - uses: actions/cache@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            mypy-${{ runner.os }}-
      - name: uv sync
        if: needs.changes.outputs.docs_only != 'true'
        run: uv sync --all-extras
      # BLOCKING on the verification-truth code (factory/chain/gates/): this is
      # the code that decides whether a PR is safe to merge, so it must not
      # accrue type debt. The job FAILS if this subset regresses (WS1.6,
      # 2026-07-19). The rest of factory/ carries ~85 pre-existing findings and
      # is still surfaced as an advisory count until that debt is paid down.
      - name: mypy (blocking on chain/gates)
        if: needs.changes.outputs.docs_only != 'true'
        run: uv run mypy factory/chain/gates/
      - name: mypy (advisory, package-wide)
        if: always() && needs.changes.outputs.docs_only != 'true'
        run: |
          uv run mypy factory/ > mypy.out 2>&1 || true
          tail -3 mypy.out
          COUNT=$(grep -c "error:" mypy.out || true)
          echo "::warning::mypy: ${COUNT} package-wide findings (advisory — tracked debt)"

  # The REQUIRED pytest contexts are the two shard legs, "pytest (1)" and
  # "pytest (2)" — branch protection names them directly (no fan-in gate job:
  # every jobs-graph hop costs ~10 s of runner pickup latency on the critical
  # path). PRs get the fast lane split in two; a merge queue (if ever
  # enabled) gets the FULL suite split the same way. Push-to-main coverage
  # lives in `pytest-full` below. Deliberately NO `needs: changes` and no
  # docs_only skip here: a docs-only PR just pays the ~40 s lane, which is
  # cheaper than the hop it would take to skip it.
  pytest:
    if: github.event_name != 'push'
    name: pytest (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    # Sized for a merge_group full-suite half; the fast-lane STEP carries its
    # own 5-minute budget backstop.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: uv sync --all-extras
        run: uv sync --all-extras

      # Deterministic halves: sorted test files, alternating by line number.
      # The per-file wall distribution is flat (max ~8 s of ~137 s serial),
      # so alternation splits evenly without a timing database.
      - name: compute shard file list
        env:
          SHARD: ${{ matrix.shard }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            # Fast lane: everything minus the hand-curated capability excludes.
            grep -vE '^\s*(#|$)' tests/fast_lane_excludes.txt | sort > /tmp/excluded.txt
            find tests -name "test_*.py" | sort | comm -23 - /tmp/excluded.txt > /tmp/pool.txt
          else
            # Merge queue: the FULL suite, split the same way.
            find tests -name "test_*.py" | sort > /tmp/pool.txt
          fi
          awk -v s="$SHARD" 'NR % 2 == s % 2' /tmp/pool.txt > /tmp/shard.txt
          echo "$(wc -l < /tmp/shard.txt) files in shard $SHARD"

      # -------- FAST LANE: pull_request only ---------------------------------
      # Capability rule (tests/fast_lane_excludes.txt): server boots /
      # sandboxes / docker / bulk subprocess spawners run post-merge. No
      # coverage. xdist loadfile keeps file-scoped fixtures on one worker.
      # The manifest guard (tests/test_fast_lane_manifest.py) runs IN this
      # lane, so a rotten manifest fails the PR that rotted it. The 5-minute
      # step timeout is the budget backstop: an unclassified heavy file makes
      # the lane loudly slow, never silently unguarded.
      - name: pytest (fast lane — PR-blocking)
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        run: uv run pytest -q --tb=short -n 4 --dist loadfile $(tr '\n' ' ' < /tmp/shard.txt)

      # -------- MERGE QUEUE: full suite, no coverage --------------------------
      - name: pytest (full suite — merge queue)
        if: github.event_name == 'merge_group'
        run: uv run pytest -q --tb=short $(tr '\n' ' ' < /tmp/shard.txt)

  # -------- FULL LANE: push to main (post-merge) ------------------------------
  # Everything, exactly as before E6, plus COVERAGE_CORE=sysmon (Python 3.12 +
  # coverage >= 7.4): sys.monitoring instead of the classic trace function —
  # same numbers, far less overhead. Not a required PR context; the interim
  # rule (red main outranks everything) and the stage-2 main-green guard are
  # what make this a gate.
  pytest-full:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Serialize full-lane runs. E6 made back-to-back merges cheap, so
    # post-merge full lanes now overlap — and every run's badge step pushes to
    # the SAME python-coverage-comment-action-data branch, where the loser of
    # the non-fast-forward race fails the whole job (observed first day out:
    # three merges, three concurrent runs, e5374ec4's run red with a GREEN
    # test step). cancel-in-progress stays false: every merged SHA must get
    # its own full-suite verdict — cancelling one is a silent coverage gap.
    concurrency:
      group: pytest-full-main
      cancel-in-progress: false
    permissions:
      # python-coverage-comment-action stores badge data on a repo branch
      # (push to main).
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"
      - name: uv sync --all-extras
        run: uv sync --all-extras
      - name: pytest with coverage (full lane)
        env:
          COVERAGE_CORE: sysmon
        run: uv run pytest -q --tb=short --cov=factory --cov-report=
      - name: Coverage comment + badge
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60
