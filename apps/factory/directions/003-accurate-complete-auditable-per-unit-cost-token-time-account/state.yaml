    \ yet trustworthy for auditing spend per dispatched unit of work. Concrete gaps\
    \ found 2026-07-19: (1) ATTRIBUTION IS LEAKY \u2014 many chain-persona runs have\
    \ story_id=NULL (observed: 482 dev, 834 sm, 945 onboarder, 351 test_implementer,\
