    \ Every chain persona run (sm/dev/reviewer/tech_writer/onboarder/test_implementer/docs_enforcer)\
    \ MUST stamp story_id AND direction_id AND app on its runs row. (2) ~2900 rows\
    \ have NULL/zero cost \u2014 every call must record a real cost, or explicitly\
    \ flag why it is zero (e.g. cache-only). (3) COST ACCURACY UNVERIFIED \u2014 runs\
    \ show ~93% prompt-cache hit; confirm the cost formula prices cached input tokens\
    \ at the provider's discounted cache-read rate (not full input price), for every\
    \ model/provider in model_router; fix if wrong and add a unit test pinning the\
    \ per-model price math. (4) NO per-direction / per-app rollup and no reconciliation\
    \ against the real provider bill.\n\nWHAT TO BUILD: (a) thread story_id/direction_id/app\
    \ into the runner so 100% of chain runs are attributed (add a completeness assertion/metric:\
    \ unattributed-chain-run count should be ~0); (b) verify+fix cache-aware cost\
    \ math with tests; (c) an operator audit command (extend `factory spend` or add\
    \ `factory audit`) that reports tokens_in/tokens_out/cost/wall-time rolled up\
    \ per story, per direction, and per app, with a flag for any unattributed spend;\
    \ (d) a reconciliation note comparing summed cost_usd to the provider's billed\
    \ amount for a window, to validate accuracy.\n"
