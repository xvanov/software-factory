  tracker_title: D005 redact provider secrets from persisted run error text
  tracker_body: '## Summary

    D005 asks for one security fix in the runner persistence path: redact provider
    secrets from run `error` text before the value is written to `state/factory.db`.


    ## Why this matters

    WHY does this need to land? Because provider SDK exceptions can echo raw credentials
    on auth/rate-limit failures, and the current persistence path stores that text
    verbatim. That turns one transient provider failure into durable secret exposure
    in the runs table, `factory spend`/audit output, and any copied DB.


    ## What the direction explicitly requires

    - Add a pure helper that redacts common provider-secret patterns from arbitrary
    strings.

    - Patterns called out explicitly: `sk-...`, `sk-ant-...`, `Bearer <token>`, `Authorization:
    ...`, and long key-like hex/base64 runs.

    - Replacement must be the literal `[REDACTED]`.

    - Apply the redactor inside `factory.runner._record_run` before writing the run
    row.

    - Preserve non-secret text byte-for-byte.

    - Make redaction idempotent.

    - Add unit coverage for token redaction, header redaction, unchanged plain error
    text, and the `_record_run` persistence path.


    ## PM read

    WHY split this? Because even a small fix benefits from one abstraction-introduction
    slice and one persistence-wire slice. That keeps the pure-function behavior easy
    to test in isolation and the DB write-path change easy to review.


    ## Acceptance criteria to verify downstream

    - No persisted run row contains a raw matched secret pattern in `error`.

    - Re-running the redactor on already-redacted text does not change it further.

    - Plain error strings remain unchanged.

    - `_record_run` persists `[REDACTED]` instead of the original secret-bearing substrings.

    '
  child_stories:
