  tracker_title: D006 factory apps CLI to list configured apps and key config
  tracker_body: '## Summary

    Add a read-only `factory apps` CLI command that lists configured apps discovered
    under `apps/*/config.yaml` and surfaces safety-relevant fields: app name, repo,
    `self_tick_enabled`, and `deploy.enabled`.


    ## Why

    Operators currently have to inspect each app config by hand to answer basic operational
    questions. WHY is that bad? Because it is slow, error-prone, and unauditable.
    WHY these fields? Because they directly affect safety and deployment behavior.
    WHY now? Because the direction is explicitly asking for a small, isolated visibility
    improvement in the CLI with a tiny loader over app configs.


    ## Acceptance Criteria from direction

    - New `factory apps` CLI command lists every app under `apps/` that has a `config.yaml`,
    one row per app.

    - Each row shows at least: app name, repo, `self_tick_enabled`, and `deploy.enabled`,
    reading effective values from the app''s `config.yaml`.

    - Command is read-only and exits 0 when at least one app is found.

    - Unit test invokes the command or underlying pure list function against a temp
    `apps/` tree with two app configs and asserts both apps and their `self_tick_enabled`
    / `deploy.enabled` values appear in output.


    ## PM triage

    - Type: feature

    - Priority: p2

    - Backpressure: sufficient because `explore: true` is present.

    - Risk: low, but context is missing for this repo, so implementation should stay
    minimal and avoid broad CLI refactors.


    ## Proposed delivery shape

    Small vertical slice: implement config discovery + command wiring + test coverage
    in one PR-sized story. WHY one story? Because the requested change is read-only,
    isolated, and the acceptance criteria are narrow enough to fit a single dev-completable
    slice without exceeding chain limits.

    '
