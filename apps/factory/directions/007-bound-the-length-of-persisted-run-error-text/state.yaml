  tracker_title: D007 bound persisted run error text length
  tracker_body: '## Summary

    Bound persisted run error text in `factory.runner._record_run` so oversized provider
    errors or stack traces do not bloat `state/factory.db`.


    ## Why

    - WHY store multi-megabyte errors if accounting and audit only need a bounded,
    readable summary?

    - WHY now? Because this is a small, single-call-site containment fix with clear
    acceptance criteria.

    - WHY this shape? A pure helper keeps truncation logic deterministic, testable,
    and reusable.


    ## Direction details

    Acceptance criteria from the direction:

    - Add a pure helper that truncates a string to a bounded max length (default 4000
    chars), appending a clear marker like `...[truncated N chars]` when truncation
    occurs.

    - `_record_run` must apply the bound to the already-redacted error before persisting.

    - Text at or under the bound is unchanged; helper is idempotent.

    - Unit test covers both persistence-path truncation for over-long text and verbatim
    storage for short text.


    ## PM read

    This is a tight infra/quality slice, not a broad refactor. One vertical story
    should land it cleanly: introduce helper, wire the one persistence path, prove
    behavior with focused unit coverage.

    '
