  tracker_title: D008 add --json output flag to factory apps command
  tracker_body: '## Summary

    Add a `--json` flag to `factory apps` so automation can consume the configured
    app listing without scraping the existing Rich table output.


    ## Why / backpressure

    - WHY does this matter? The current table is for humans, not scripts.

    - WHY now? Monitoring/automation and loop-3 tooling need a stable machine-readable
    output.

    - WHY this shape? The direction asks for the same per-app data, emitted as a JSON
    array to stdout, with no behavior change to the default table path.

    - WHY is this shippable? It is explicitly small, additive, and isolated to the
    CLI command plus its underlying list function.


    ## Acceptance criteria from direction

    - `factory apps --json` prints a JSON array to stdout, one object per configured
    app, with at least the keys: `name`, `repo`, `self_tick_enabled`, `deploy_enabled`.

    - The default `factory apps` (no `--json`) still prints the existing human-readable
    table unchanged.

    - The JSON output is valid, parseable JSON and is the only thing written to stdout
    in `--json` mode.

    - A unit test asserts that `--json` emits parseable JSON containing both apps
    and their `self_tick_enabled` / `deploy_enabled` values, and that the non-json
    path still renders a table.


    ## PM notes

    This is a single vertical slice, not a multi-PR effort. WHY split further when
    the user-visible value only exists once the flag and test land together? Keep
    the implementation minimal: add the CLI flag, emit JSON from the same app-listing
    data source, preserve the current default path exactly, and verify both modes
    in tests.'
  child_stories:
  - title: D008 add --json mode to factory apps with coverage
    scope: backend
    chain_kind: tdd
    rationale: 'Single vertical CLI slice: the user value only exists when the command
