  tracker_body: '## Summary

    Provide the UX auditor with the runtime inputs it actually needs to validate flows:
    at least one concrete `flow.md` artifact and app URL/runtime context on scheduled
    UX audits.


    ## Why

    The current gap is not cosmetic. WHY can''t the auditor validate user flows today?
    Because it lacks the flow definitions and target runtime. WHY does that matter?
    Because an auditor without the exact flow file and runtime can only guess, and
    guessed UX findings are low-trust.


    ## Acceptance Criteria

    - [ ] Scheduled UX audit input includes at least one `flow.md` plus app URL/runtime
    context.

    - [ ] UX auditor can reference concrete flow filenames and step numbers from supplied
    artifacts.


    ## PM Notes

    - Backpressure is sufficient because `explore: true` is present.

    - This should be split into small vertical slices: first establish how scheduled
    UX audit input carries runtime artifacts, then make the auditor consume and cite
    those artifacts.

    - WHY split this way? Because plumbing inputs and proving citation behavior are
    separable, independently reviewable slices.

    - Repo context is currently unavailable, so file-level implementation details
    may shift once the codebase is inspected.'
