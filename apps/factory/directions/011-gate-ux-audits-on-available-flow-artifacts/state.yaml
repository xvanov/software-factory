    estimated_sandbox_iterations: 120
    points: 3
  - title: D011 include flow.md path and contents in UX audit payload
    scope: backend
    chain_kind: tdd
    rationale: 'Second vertical slice: ensure replay-based auditing receives at least
      one actual `flow.md` artifact path and contents in its invocation payload. WHY
      separate this? Because payload assembly is a different failure mode from gating
      and can land independently after the guardrail exists. Tests should prove the
      payload contains the expected flow artifact before replay-based auditing proceeds.'
