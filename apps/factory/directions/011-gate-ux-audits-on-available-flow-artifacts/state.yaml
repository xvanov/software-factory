  tracker_title: D011 gate UX audits on available flow artifacts
  tracker_body: '## Summary

    Gate replay-based UX auditing on the presence of `flow.md` artifacts.


    ## Why

    Today the auditor can be asked to replay user flows without any flow narratives
    in the invocation context. WHY does that matter? Because replay-based auditing
    without a flow artifact is guesswork, not evidence. This direction narrows execution
    so UX audits only run when at least one `flow.md` is actually available to replay.


    ## Acceptance Criteria

    - [ ] UX auditor run is skipped or marked not-applicable when zero `flow.md` files
    are available.

    - [ ] Invocation payload includes at least one `flow.md` path and contents before
    replay-based auditing runs.


    ## PM Notes

    - WHY split this? There are two distinct value slices: first, enforce the gate
    so we do not run invalid audits; second, ensure the invocation payload actually
    carries the flow artifacts needed for replay.

    - Smallest user-visible win lands first: prevent invalid UX replay runs when no
    flow artifacts exist.

    - Follow-on slice wires the required artifact path/content into the invocation
    payload so replay-based auditing has empirical input when it does run.'
  child_stories:
  - title: D011 skip or mark UX replay audit N/A without flow.md
    scope: backend
    chain_kind: tdd
    rationale: 'First vertical slice: enforce the guardrail where UX replay-based
      auditing is triggered. WHY first? Because preventing invalid runs delivers immediate
      correctness even before payload enrichment lands. This should be implemented
      at the decision point that launches or classifies the auditor run, with tests
      covering the zero-flow case.'
    estimated_new_files: 1
