  tracker_title: D012 persist direction status in database
  tracker_body: '## Summary

    Persist direction status in a new `directions` database table and demote `state.yaml`
    from source-of-truth to regenerable projection. Restore ancestor shipped-story
    context lookup through the database link from `stories.direction_id`.


    ## Why / pressure test

    - WHY is this needed? Machine state in git is dirtying the repo on every transition.

    - WHY else? One fact has two writers today: DB for stories, filesystem for directions.

    - WHY now? Ancestor-story context cannot be restored from filenames; it needs
    a direction row in the DB.


    ## In scope

    - Add `directions` table with the documented columns, uniqueness, and hot-read
    index.

    - Change read path so `pending_directions(app, root, db_path)` resolves status
    from DB first, then `state.yaml`, then `created`.

    - Change write path so `mark_direction_status(direction, status, by, details)`
    writes DB authoritatively and writes `state.yaml` as best-effort projection.

    - Add idempotent `factory directions-backfill --app <app> [--dry-run]` command
    with `imported=<n> skipped=<n>` output and dry-run default.

    - Restore `compose_context_prelude` ancestor section using deployed stories selected
    through `stories.direction_id` when `db_path` is supplied.

    - Keep `state.yaml` for human inspection and prove deletion/regeneration behavior
    with tests.


    ## Acceptance criteria from direction

    - A `directions` table exists with one row per direction, keyed by app and direction
    id, holding at minimum: status, tracker issue number, created-at, and the last
    transition''s timestamp and actor.

    - `pending_directions` returns the same directions as before when the database
    is populated, reading status from the database rather than from `state.yaml`.

    - A direction whose `state.yaml` is deleted keeps its status across a factory
    restart, and `pm-sync` does not re-triage it.

    - Every existing on-disk direction is imported into the table by a one-time backfill
    that is safe to run twice and reports how many rows it wrote.

    - `compose_context_prelude` includes a "Merged Story / Dev Agent Record" section
    for an ancestor direction that has at least one deployed story, resolved through
    the database, and omits the section when there is none.

    - `state.yaml` is still written for human inspection, and a test asserts the file
    can be deleted and regenerated from the database without changing status.


    ## Notes

    - No HTTP surface changes.

    - `direction.md`, `flow.md`, and `api_spec.md` remain git-authored source of intent.

    - Backfill should stay explicit CLI-driven per direction preference, not a silent
    automatic migration.


    ## Proposed implementation slices

    Ordered small because one big backend bundle will stall the chain. Land the storage
    skeleton first, then the read/write paths, then operator migration, then context
    restoration.'
