  tracker_title: D014 detect tests that bypass the app entry point
  tracker_body: '## Summary

    Add one narrow slop-detector rule for Python tests that bootstrap database/schema
    infrastructure directly instead of driving the app entry point. WHY? Because the
    failure mode here is not a vacuous assertion; it is setup that bypasses the subject,
    so the test can only prove SQLModel/SQLAlchemy behavior, not app behavior.


    The new rule should flag direct calls in test files to:

    - `SQLModel.metadata.create_all`

    - `sqlmodel.create_engine`

    - `sqlalchemy.create_engine`


    The finding must:

    - emit a stable new `kind`

    - include a `why_slop` explanation that explicitly names `factory.observability.schema.migrate`
    as the app initializer the test should have driven

    - flow through the existing `tests-meaningful` gate path with no new gate label

    - respect the existing `# noqa: slop` single-test suppression


    ## Why this matters

    A prior test asserted on a table created by ORM metadata imported inside the test
    itself, while production `migrate()` still created nothing. CI then redispatched
    repeatedly against a test structurally incapable of observing the defect. This
    direction closes that exact hole with one mechanical detector, not a broad style
    judgement.


    ## Acceptance criteria from direction

    - Detector reports a finding with a stable new `kind` when a test file calls `SQLModel.metadata.create_all`
    or a `create_engine` variant directly.

    - Finding carries a `why_slop` explanation naming the app initializer the test
    should have called.

    - A test that obtains its database through the app initializer produces no finding.

    - Existing `# noqa: slop` escape hatch suppresses the new finding on a single
    test.

    - `factory/observability/schema.py`''s own tests either pass or are explicitly
    suppressed.

    - `tests-meaningful` blocks a PR whose diff introduces the new finding through
    the existing path, with no new gate label.

    - Regression coverage includes the exact story-148 bad test body being flagged
    and its fixed form being clean.


    ## Decomposition logic

    WHY split this? Because detector mechanics, gate plumbing proof, and repo-suite/regression
    cleanup are separable vertical slices. The chain lands smaller PRs more reliably
    than one broad "all infra work" bundle.

    '
