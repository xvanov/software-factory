  tracker_title: D015 executable fixtures for factory CLI UX audits
  tracker_body: '## Summary

    Direction D015 requests executable evidence for operator-facing `factory` CLI
    UX audits.


    ## Why

    The current audit flow is blocked by a text-only runtime that cannot execute the
    documented operator steps or inspect resulting state transitions. The ask is to
    make the audit empirically runnable by either:

    - enabling a runtime that can execute the documented `factory` CLI flow against
    provisioned state, or

    - providing recorded fixtures that capture command output plus state evidence
    for each step.


    ## Backpressure check

    - WHY now? The documented operator flow from direction 012 cannot currently be
    verified in this environment.

    - WHY is this actionable? `flow.md` exists and points to the blocked audit step,
    the missing execution capability, and the fallback of recorded fixtures.

    - WHY not spawn one big story? Because runtime enablement, fixture capture, and
    audit-consumption plumbing are different failure modes and need small landing
    slices.


    ## Acceptance criteria from direction

    - UX audit runtime can execute documented `factory` CLI flows or consume recorded
    fixtures with command output and state evidence for each step.


    ## PM decomposition notes

    The smallest validating path is fixture-first unless the repo already has a stable
    executable harness. Stories are sequenced so the chain can first establish a fixture
    contract, then capture one audited flow, then make the audit consume it. If live
    execution support is desired later, that should be a follow-on iteration unless
    it fits as a small, isolated slice.'
  child_stories:
