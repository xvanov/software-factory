  tracker_title: D016 seed recoverable blocked-story fixtures for UX audit
  tracker_body: '## Summary

    Direction D016 asks for executable fixtures that let the UX audit observe a recoverable
    blocked-story flow empirically instead of guessing from static state.


    ## Why

    The audit for the revival flow depends on seeing an asynchronously blocked story
    become revivable on the next tick after a PR merge. Right now there is no executable
    integration-ready setup to produce that evidence. WHY does this matter? Because
    if operators cannot observe the before/after transition directly, the audit cannot
    tell whether recovery is clear or confusing.


    ## Backpressure check

    - `flow.md` exists and is non-empty, so backpressure is sufficient.

    - Acceptance criterion is present and testable: load a seeded blocked story, advance
    one tick, capture before/after status evidence for the revival step.


    ## Requested outcome

    Seed an audit-ready blocked-story + merged-PR fixture path that supports:

    1. Loading a known blocked story fixture.

    2. Advancing runtime by one tick.

    3. Capturing observable before/after status evidence for the revival transition.


    ## Decomposition logic

    WHY split this? Because a single "build audit mode" story is too vague and too
    large. The smallest useful path is:

    1. create the fixture seed itself,

    2. expose a one-tick execution path that applies the transition,

    3. document how the UX audit invokes and records the evidence.


    ## Risks / open questions

    - No repo context is available yet, so exact implementation surface may differ
    once code is inspected.

    - The direction does not require a browser or deploy target; the observable evidence
    can be integration/runtime level if it is executable and captures before/after
    state.

    - If the current runtime lacks any controllable tick entrypoint, dev may need
    to implement the smallest deterministic test harness rather than a full audit
    environment.

    '
