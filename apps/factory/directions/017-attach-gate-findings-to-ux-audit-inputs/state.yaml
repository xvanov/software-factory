  tracker_title: D017 attach gate findings to UX audit inputs
  tracker_body: '## Summary

    Attach reproducible `tests-meaningful` finding artifacts to the scheduled UX audit
    inputs so the audit can assess the actual operator-facing message quality, not
    a placeholder invocation.


    ## Why

    The current audit input path does not include the real gate output surface. That
    blocks evaluation of whether the message is understandable and actionable when
    the gate goes red.


    ## Direction evidence

    - Acceptance criteria require scheduled UX audit input to include reproducible
    `tests-meaningful` finding artifacts with rule id, file, line, and remediation
    text.

    - Flow points to Direction 014 step 2 and states the audit currently uses `text_run`
    without CI/PR surface, browser access, or a captured gate artifact.

    - Suggested path is to expose CI finding artifacts or reproducible local gate
    command output to the audit.


    ## PM triage

    WHY does this matter? Because the audit cannot judge clarity without the exact
    finding text.

    WHY now? Because the documented flow expects PR gate output with file/line evidence,
    and the current audit input omits that evidence.

    WHY this scope? Smallest validating change is to get reproducible artifacts into
    the scheduled audit inputs first; any richer UX interpretation can happen after
    the audit sees the real payload.


    ## Acceptance criteria from direction

    - Scheduled UX audit input includes reproducible `tests-meaningful` finding artifacts
    showing rule id, file, line, and remediation text.


    ## Proposed slices

    1. Add a reproducible artifact producer for `tests-meaningful` findings that captures
    the required fields.

    2. Wire the scheduled UX audit input builder to attach or include that artifact.

    3. Document the artifact shape and audit-input path for future operators.

    '
