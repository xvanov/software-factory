name: sacrifice
repo: xvanov/sacrifice
default_branch: main
context_dir: context
# Path to the app source tree (sibling of the factory root by default).
# Phase 7: resolve_app_repo_path(...) uses this to thread the real repo
# into every compose_context_prelude call. ``../sacrifice`` resolves to
# ``~/sacrifice/`` when the factory is at ``~/software-factory/``.
app_repo_path: "../sacrifice"
# Phase 5 deploy block. Sacrifice is locally-hosted via Docker Compose,
# so every command targets ``localhost``. ``enabled: false`` until the
# Dockerfiles + docker-compose.prod.yml + ``/healthz`` endpoint exist
# (those land as their own directions through the standard TDD chain).
# Aspirational defaults — the factory reads these strings verbatim and
# stays stack-agnostic.
deploy:
  enabled: false
  working_directory: "."
  pre_deploy_commands:
    - "docker compose -f docker-compose.prod.yml build"
  deploy_command: "docker compose -f docker-compose.prod.yml up -d"
  health_check_command: "curl -fsS http://localhost:8000/healthz"
  health_check_max_attempts: 10
  health_check_interval_seconds: 3
  smoke_test_command: "make smoke"
  rollback_command: "docker compose -f docker-compose.prod.yml.previous up -d"
  post_deploy_record:
    container_state: "docker compose ps --format json"
  timeout_seconds: 600
  env_var_passthrough:
    - STRIPE_API_KEY
    - DATABASE_URL
# Phase 4 gate commands. Aspirational defaults — Sacrifice's actual lint
# stack lands in a future direction. The factory reads these strings
# verbatim; the chain stays stack-agnostic.
gates:
  lint_command: "ruff check . && cd frontend && npm run lint"
  format_check_command: "ruff format --check ."
  type_check_command: "mypy backend"
  # Run from backend/ — sacrifice's pyproject.toml + pytest config live
  # there, not at the repo root. Limit to ``tests/`` (the unit-test
  # tree); ``backend/e2e_test.py`` requires a running stack (postgres,
  # backend, celery) and is the operator's smoke gate, not the dev-loop
  # gate. Use ``uv run --extra dev`` so each per-story worktree
  # self-syncs the backend's declared deps (asyncpg, pytest-asyncio,
  # etc.) into a local .venv before pytest collection — without this
  # the worktree falls back to the factory's ambient .venv which lacks
  # sacrifice-specific runtime deps and pytest exits with a
  # ModuleNotFoundError collection error (exit code 4), routing every
  # backend story to BLOCKED_TESTS_NEED_CLARIFICATION.
  # The full unit-test tree runs green (2026-07-06: the auth/proof/charge/
  # dashboard/notification baseline that used to be --ignore'd was fixed —
  # those failures were real product defects, e.g. the proof-validation
  # bypass, the self-verification pledge escape, and never-capturing charges).
  # Keep this at ``tests/`` with NO exclusions: a re-introduced exclusion here
  # hides exactly the class of bug that shipped the broken app. ``e2e_test.py``
  # stays out because it needs a live stack (postgres+backend+celery) and is
  # the operator's smoke gate, not the dev-loop gate.
  test_command: "cd backend && uv run --extra dev pytest -q tests/"
  coverage_command: "pytest --cov=backend --cov-report=json --cov-fail-under=70"
  e2e_command: "npx playwright test"
  # No runnable Playwright/browser harness exists in this repo yet (the only
  # playwright config/specs on disk are orphaned artifacts). Until one is set
  # up, test_designer must NOT mandate E2E/Playwright — doing so produced
  # harness-breakage "reds" that deadlocked every frontend/E2E story. Flip to
  # true once a real Playwright harness + runnable stack exist.
  e2e_harness_ready: false
  mutation_testing: false
  # Flaky-red resilience: on a test-gate RED, rerun the failures in isolation;
  # a test that fails-then-passes is quarantined (non-blocking, recorded as
  # tech debt) rather than blocking the merge. A consistent red still blocks.
  flake_quarantine: true
  # D002 Karpathy Layer-2 runtime verifier. `make smoke` boots/reuses the
  # backend and drives register→login→create→activate→submit-proof — the exact
  # path that shipped broken while every gate was green (and whose unit tests,
  # test_auth.py / test_email_auth.py / test_api_endpoint_verification.py, are
  # in the --ignore baseline above, so NOTHING was verifying them). The journey
  # is offline + deterministic (api_endpoint goal points at the backend's own
  # /api/health; no Celery/LLM/network). Validated green in reuse mode.
  smoke_command: "make smoke"
  # TRUE since 2026-07-15 (D002 P0.2 closed): `smoke-green` is a REQUIRED merge
  # gate (factory/chain/gates/evaluator.py::required_gate_labels). Trustworthy
  # because sacrifice@8becb91 made isolated boot the DEFAULT: `make smoke` now
  # boots the checkout's OWN backend (worktree-safe via `uv run uvicorn`, no
  # .venv needed) on a free ephemeral port and kills exactly that pid — reuse
  # of a running backend requires an explicitly set SMOKE_BASE_URL. Verified:
  # fresh worktree green with a decoy occupying :8000. Requires the
  # sacrifice-db container to be startable (`make up-db`).
  smoke_harness_ready: true

  # ── 019 AC2+AC3 — out-of-process acceptance oracle ──────────────────────────
  # LIVE since 2026-08-08 (direction 019 AC4). ``acceptance-verified`` is now a
  # REQUIRED merge gate for every AC-carrying story in this app, and it FAILS
  # SAFE: a story whose oracle cannot be run, whose app will not boot, or whose
  # criteria are all satisfiable by a no-op is BLOCKED, never waved through.
  #
  # Flipped only after the whole path was exercised against the real app in a
  # throwaway clone (no LLM spend, no writes to /home/k/sacrifice) — a route
  # that does not exist at the merge base, added at HEAD:
  #   red at merge base b40e87aff062 (404 -> the assertion fails)
  #   green at HEAD, verdict computed OUT OF PROCESS over HTTP
  #   failability_route=merge_base_red, authoritative=true, verified=true
  #   the positive-observable criterion failed BOTH stub variants -> CREDITED
  #   a status-code-only criterion passed both stubs -> EXCLUDED as vacuous
  #
  # Two operational prerequisites, or every AC-carrying story blocks (by
  # design, with a named reason): the ``sacrifice-db`` container must be up
  # (``prerequisite_command`` below CHECKS it, and never starts it — a merge
  # gate must not mutate the machine), and the boot recipe's DATABASE_URL must
  # stay explicit rather than inherited (see the env block, PR #253).
  #
  # To turn it off, set this false — do not delete the recipe below.
  acceptance_oracle: true
  acceptance_boot:
    # Same shape as ``smoke_command`` (make smoke / scripts/smoke.sh): a real
    # uvicorn process on an ephemeral port, never a shared/reused server.
    command: "uv run --extra dev uvicorn app.main:app --host 127.0.0.1 --port {port} --log-level info"
    cwd: "backend"
    health_path: "/api/health"
    boot_timeout_seconds: 180
    run_timeout_seconds: 300
    shutdown_grace_seconds: 5
    env:
      # EXPLICIT, not inherited: sacrifice's ``Settings`` refuses to start when a
      # secret field still holds its hardcoded default, so a boot with no
      # DATABASE_URL dies at import with a pydantic ValidationError and every
      # AC-carrying story blocks ``head_boot_failed``. Measured 2026-08-07 by
      # booting a real judge worktree before the flag flip. It was previously
      # only in ``env_passthrough``, i.e. it depended on the operator's ambient
      # shell — a merge gate must never depend on that. Port 5433 is the
      # loopback-bound ``sacrifice-db`` container (the same one
      # ``prerequisite_command`` checks and ``backend/tests/conftest.py`` uses).
      # NOTE this is the SHARED dev database: cross-run contamination is a
      # documented KNOWN OPEN risk of this runner — oracles must namespace the
      # entities they create with ``ACCEPTANCE_RUN_ID``.
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5433/sacrifice"
      JWT_SECRET: "acceptance-oracle-test-only-secret"
      SACRIFICE_MEDIA_DIR: "{run_dir}/media"
      DIRECTIONS_PATH: "{run_dir}/directions"
      FRONTEND_URL: "http://127.0.0.1:{port}"
      STRIPE_LIVE_MODE: "false"
    # TMPDIR deliberately omitted — see AcceptanceBootConfig.env_passthrough's
    # docstring (2026-08-07): forwarding it hands the booted app's own
    # production code the directory the oracle's throwaway run-dir lives
    # under, narrowing (not closing) a same-user tamper attack.
    env_passthrough:
      - PATH
      - HOME
      - LANG
      - LC_ALL
      - UV_CACHE_DIR
      - XDG_CACHE_HOME
      - DATABASE_URL
    # A CHECK, never a start — the same container the smoke gate depends on.
    # The braces in the docker format string are LITERAL (docker's own
    # ``{{.Names}}`` template syntax), never touched by the {port}/{base_url}/
    # {run_id}/{run_dir} substitution, because this string is never substituted
    # at all — ``check_prerequisite`` runs it verbatim.
    prerequisite_command: "docker ps --format '{{.Names}}' | grep -qx sacrifice-db"
    prerequisite_hint: "make up-db"
  # Repo-layout facts for the (dev-blind) acceptance author — HTTP routes now,
  # not an import path: the oracle runs out of process and never imports the
  # app (019 AC3), so it needs where to send requests, not where to import from.
  # CORRECTED 2026-08-08. The auth lines below used to name
  # `POST /api/auth/register` and `POST /api/auth/login`. NEITHER ROUTE EXISTS
  # — and never has. The real ones carry an `/email` segment
  # (`backend/app/routes/auth.py`, `APIRouter(prefix="/api/auth")`). Story 172,
  # the only story graded before this was found, asserted `/api/meta` and never
  # touched auth, so the error stayed invisible until direction 117 (verified
  # email) made an oracle follow it. A dev-blind author cannot check a route
  # fact against the tree, and this hint tells it "never a guessed variant" —
  # so a wrong fact here is laundered into an authoritative-looking oracle that
  # 404s at HEAD no matter how correct the implementation is. That fails SAFE
  # (a false block, never a false green — see the memory
  # `acceptance_oracle_first_execution`), but it makes every auth-touching
  # story unmergeable. Re-verify these against the tree when auth changes.
  # TEMPORARY BY DESIGN — this block is the MECHANISM `docs/BENCHMARK-READINESS-PLAN.md`
  # exists to remove (Workstream A). Hand-maintained API facts that the dev-blind
  # oracle author cannot verify have drifted three times, each blocking a CORRECT
  # implementation (fabricated auth routes 2026-08-08; an invented 401 body
  # #277/#278; the goal-creation schema absent, which blocked story 179 after it
  # had passed six gates). Owner: loop-3 operator. Expiry: when A1's derived-surface
  # cross-check lands, the ROUTE and REQUIRED-FIELD facts here become CI-verified
  # against the app's real surface; the semantic facts (plugin-type enums, error
  # vocabulary, response bodies) stay here because a FastAPI schema that declares
  # no `responses=` and no `response_model` cannot express them. Adding a fact
  # here is a stopgap, not the fix — re-read Workstream A before doing it again.
  acceptance_harness_hint: |
    - The backend is a FastAPI app, reachable at $ACCEPTANCE_BASE_URL. Health:
      `GET /api/health` -> `200 {"status": "ok"}`. (`GET /healthz` and
      `GET /healthz/db` also exist and are deliberately NOT under `/api`.)
    - Every other route is prefixed `/api`. Use the exact paths and methods the
      direction's api_spec.md states, never a guessed variant.
    - Auth, verified against `backend/app/routes/auth.py` 2026-08-08 — these
      exact paths, including the `/email` segment:
      * `POST /api/auth/email/register` with `{"email": ..., "password": ...}`
        -> `200 {"access_token": ..., "user": {"id", "email", "display_name",
        "avatar_url", "auth_provider"}}`. It ALREADY returns a bearer token, so
        a separate login call is not needed to get one. A duplicate email is
        `409 {"error": "account_exists"}`; a weak password is `400`. The email
        is lowercased on the way in.
      * `POST /api/auth/email/login` with the same JSON body -> the same shape.
        It is JSON, not OAuth2 form-encoded.
      * `GET /api/auth/me` with `Authorization: Bearer <access_token>` -> the
        same `user` dict. This is the ONLY "current user" route — there is no
        equivalent anywhere under `/api/users`.
    - Creating a goal, verified against `backend/app/schemas/goal.py` +
      `backend/app/routes/goals.py` + the app's own `VALID_GOAL` fixture
      (`backend/tests/test_goals.py`) 2026-08-09. MANY criteria need a goal to
      exist before they can observe anything, and a goal cannot be created from
      `{"title": ...}` alone — that is `422`, which fails the criterion for a
      reason that has nothing to do with the behaviour under test:
      * `POST /api/goals` (no trailing slash) with `Authorization: Bearer <token>`
        -> `201` with `{"id", "title", "pledge_amount", "goal_type", "criteria",
        "status": "draft", ...}`.
      * REQUIRED fields, all of them, or it is `422`: `title` (str),
        `deadline` (ISO-8601 datetime). COMPUTE IT AT RUNTIME, e.g.
        `(datetime.now(timezone.utc) + timedelta(hours=2)).isoformat()` — never a
        hardcoded literal. The oracle is authored once and re-run later, so a
        timestamp that was future when written expires and the create call starts
        failing `422` for a reason unrelated to the behaviour under test.
        Activation needs a deadline at least an hour out), `pledge_amount`
        (int > 0), `goal_type` (str),
        `criteria` (object).
      * `goal_type` must be a REGISTERED plugin type — an arbitrary string is
        rejected at creation. `"youtube_video"` is a known-good value, and it
        expects `criteria` shaped like
        `{"min_duration_seconds": 300, "video_description": "..."}`.
      * Optional: `description`, `charity_id`, `timezone` ("UTC"),
        `recurrence` ("none"|"daily"|"weekly"|"monthly"), `currency` ("usd").
    - Data is a real, SHARED Postgres instance across runs (no per-run reset).
      Namespace any email/slug/identifier you create with `$ACCEPTANCE_RUN_ID`
      so two runs never collide and a stale record from a previous run can
      never make a real bug look green.
models: {}  # use default routing
