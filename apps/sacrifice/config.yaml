name: sacrifice
repo: xvanov/sacrifice
default_branch: main
context_dir: context
# Path to the app source tree (sibling of the factory root by default).
# Phase 7: resolve_app_repo_path(...) uses this to thread the real repo
# into every compose_context_prelude call. ``../sacrifice`` resolves to
# ``~/sacrifice/`` when the factory is at ``~/software-factory/``.
app_repo_path: "../sacrifice"
# Phase 5 deploy block. Sacrifice is locally-hosted via Docker Compose,
# so every command targets ``localhost``. ``enabled: false`` until the
# Dockerfiles + docker-compose.prod.yml + ``/healthz`` endpoint exist
# (those land as their own directions through the standard TDD chain).
# Aspirational defaults — the factory reads these strings verbatim and
# stays stack-agnostic.
deploy:
  enabled: false
  working_directory: "."
  pre_deploy_commands:
    - "docker compose -f docker-compose.prod.yml build"
  deploy_command: "docker compose -f docker-compose.prod.yml up -d"
  health_check_command: "curl -fsS http://localhost:8000/healthz"
  health_check_max_attempts: 10
  health_check_interval_seconds: 3
  smoke_test_command: "make smoke"
  rollback_command: "docker compose -f docker-compose.prod.yml.previous up -d"
  post_deploy_record:
    container_state: "docker compose ps --format json"
  timeout_seconds: 600
  env_var_passthrough:
    - STRIPE_API_KEY
    - DATABASE_URL
# Phase 4 gate commands. Aspirational defaults — Sacrifice's actual lint
# stack lands in a future direction. The factory reads these strings
# verbatim; the chain stays stack-agnostic.
gates:
  lint_command: "ruff check . && cd frontend && npm run lint"
  format_check_command: "ruff format --check ."
  type_check_command: "mypy backend"
  # Run from backend/ — sacrifice's pyproject.toml + pytest config live
  # there, not at the repo root. Limit to ``tests/`` (the unit-test
  # tree); ``backend/e2e_test.py`` requires a running stack (postgres,
  # backend, celery) and is the operator's smoke gate, not the dev-loop
  # gate. Use ``uv run --extra dev`` so each per-story worktree
  # self-syncs the backend's declared deps (asyncpg, pytest-asyncio,
  # etc.) into a local .venv before pytest collection — without this
  # the worktree falls back to the factory's ambient .venv which lacks
  # sacrifice-specific runtime deps and pytest exits with a
  # ModuleNotFoundError collection error (exit code 4), routing every
  # backend story to BLOCKED_TESTS_NEED_CLARIFICATION.
  # The full unit-test tree runs green (2026-07-06: the auth/proof/charge/
  # dashboard/notification baseline that used to be --ignore'd was fixed —
  # those failures were real product defects, e.g. the proof-validation
  # bypass, the self-verification pledge escape, and never-capturing charges).
  # Keep this at ``tests/`` with NO exclusions: a re-introduced exclusion here
  # hides exactly the class of bug that shipped the broken app. ``e2e_test.py``
  # stays out because it needs a live stack (postgres+backend+celery) and is
  # the operator's smoke gate, not the dev-loop gate.
  test_command: "cd backend && uv run --extra dev pytest -q tests/"
  coverage_command: "pytest --cov=backend --cov-report=json --cov-fail-under=70"
  e2e_command: "npx playwright test"
  # No runnable Playwright/browser harness exists in this repo yet (the only
  # playwright config/specs on disk are orphaned artifacts). Until one is set
  # up, test_designer must NOT mandate E2E/Playwright — doing so produced
  # harness-breakage "reds" that deadlocked every frontend/E2E story. Flip to
  # true once a real Playwright harness + runnable stack exist.
  e2e_harness_ready: false
  mutation_testing: false
  # Flaky-red resilience: on a test-gate RED, rerun the failures in isolation;
  # a test that fails-then-passes is quarantined (non-blocking, recorded as
  # tech debt) rather than blocking the merge. A consistent red still blocks.
  flake_quarantine: true
  # D002 Karpathy Layer-2 runtime verifier. `make smoke` boots/reuses the
  # backend and drives register→login→create→activate→submit-proof — the exact
  # path that shipped broken while every gate was green (and whose unit tests,
  # test_auth.py / test_email_auth.py / test_api_endpoint_verification.py, are
  # in the --ignore baseline above, so NOTHING was verifying them). The journey
  # is offline + deterministic (api_endpoint goal points at the backend's own
  # /api/health; no Celery/LLM/network). Validated green in reuse mode.
  smoke_command: "make smoke"
  # TRUE since 2026-07-15 (D002 P0.2 closed): `smoke-green` is a REQUIRED merge
  # gate (factory/chain/gates/evaluator.py::required_gate_labels). Trustworthy
  # because sacrifice@8becb91 made isolated boot the DEFAULT: `make smoke` now
  # boots the checkout's OWN backend (worktree-safe via `uv run uvicorn`, no
  # .venv needed) on a free ephemeral port and kills exactly that pid — reuse
  # of a running backend requires an explicitly set SMOKE_BASE_URL. Verified:
  # fresh worktree green with a decoy occupying :8000. Requires the
  # sacrifice-db container to be startable (`make up-db`).
  smoke_harness_ready: true

  # ── WS1.2 independent acceptance oracle ────────────────────────────────────
  # ALL FOUR SETTINGS BELOW ARE INERT until ``acceptance_oracle: true`` is set
  # (deliberately absent — flipping it is an operator decision, and it makes
  # ``acceptance-verified`` a REQUIRED merge gate for every AC-carrying story in
  # this app). They are configured first because with the defaults the gate
  # false-blocks 100% of the time: measured 2026-08-05, an oracle placed at the
  # repo root and run with the factory's own interpreter cannot import sacrifice
  # at all (``No module named 'app'``).
  #
  # Where the oracle file is placed. ``backend/tests`` — not the repo root —
  # because sacrifice's hermetic test env (DATABASE_URL, JWT_SECRET, forced
  # STRIPE_LIVE_MODE=false, …) lives in ``backend/tests/conftest.py``, and pytest
  # only loads that conftest for files underneath it.
  acceptance_test_dir: "backend/tests"
  # Where the command runs. ``backend`` is where sacrifice's pyproject/pytest
  # config lives and what puts the ``app`` package on sys.path.
  acceptance_test_cwd: "backend"
  # The app's own env, via the same wrapper the dev-loop test gate uses, so the
  # oracle runs against sacrifice's declared deps rather than the factory's.
  # NOTE: this env has no ``hypothesis``; add it to the backend's dev extra
  # before writing EARS-form acceptance criteria for this app, or property-mode
  # oracles will fail collection.
  # Requires the ``sacrifice-db`` container to be up (same prerequisite as the
  # smoke gate) — the backend conftest creates tables against localhost:5433.
  # ``-p no:cacheprovider`` is NOT optional: without it pytest writes
  # ``backend/.pytest_cache/v/cache/nodeids`` (the hidden oracle's TEST NAMES) and
  # ``lastfailed`` (which of its assertions failed) into the tree it runs in. The
  # gate now runs in a throwaway judge worktree, so today those land somewhere
  # that is deleted — this keeps the config right for any run that is not.
  acceptance_test_command: "uv run --extra dev pytest {test_file} -q -p no:cacheprovider"
  # Repo-layout facts for the (dev-blind) acceptance author. Without these the
  # author guesses module paths; the first real run produced a test that tried
  # ``sacrifice.main`` / ``main`` / ``app.main`` and errored out.
  acceptance_harness_hint: |
    - The backend is a FastAPI app. The ASGI application object is `app` in
      `app.main` (file `backend/app/main.py`); import it as `from app.main import app`.
    - Drive HTTP endpoints with `fastapi.testclient.TestClient(app)`. Do not start
      a server, and do not use `httpx.AsyncClient` against a network address.
    - Your file is placed in `backend/tests/` and run with pytest from `backend/`.
      `backend/tests/conftest.py` is loaded automatically and provides the test
      env (dummy credentials, Stripe forced into test mode) and an autouse
      `test_db` fixture that creates the schema and overrides the app's database
      dependency — so you need no database setup of your own. The app package is
      importable as `app.*`.
    - `asyncio_mode = auto` is set, so `async def` tests need no decorator.
    - Routes are mounted under `app/routes/` and most are prefixed `/api`; the
      health endpoints are the exception. Use the exact paths and methods the
      direction's api_spec.md states, never a guessed variant.
models: {}  # use default routing
