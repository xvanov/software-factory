  tracker_title: D018 add CSRF protections to cookie-authenticated routes
  tracker_body: '## Summary

    D018 targets CSRF risk on any cookie-authenticated API surface.


    ## Why

    Cross-origin app access plus session auth creates account-action forgery risk
    unless anti-CSRF controls are explicit.


    ## Acceptance Criteria

    - [ ] All state-changing authenticated routes reject requests without a valid
    CSRF token or equivalent protection.

    - [ ] Session cookie settings are reviewed and hardened for SameSite, Secure,
    and HttpOnly semantics.


    ## PM triage / WHY

    - WHY now: bearer-token compromise is already treated as high impact, and cookie-authenticated
    flows create a separate forgery path if browser requests can carry ambient credentials.

    - WHY this scope: the direction is specifically about cookie-authenticated routes,
    not every auth mechanism in the app.

    - WHY split: one PR to establish the CSRF guardrail, one PR to apply it to state-changing
    routes, one PR to harden cookie attributes, and docs separately so dev slices
    stay under chain limits.


    ## Notes for implementation

    - Explore is enabled, so downstream can inspect the current auth/session surface
    to determine which routes are actually cookie-authenticated today.

    - The route-coverage story should focus on observable rejection behavior for missing/invalid
    CSRF protection on state-changing authenticated endpoints.

    - Cookie hardening should verify session-cookie semantics for SameSite, Secure,
    and HttpOnly without broad auth redesign.

    '
  child_stories:
