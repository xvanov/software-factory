  tracker_title: D023 audit goal type selector accessibility
  tracker_body: '## Summary

    Direction D023 asks for an accessibility audit of the goal creation screen focused
    on the goal-type selector.


    ## WHY

    - WHY now? The selector is currently hard-coded and the direction explicitly calls
    for verification once live-browser execution is enabled.

    - WHY this scope? The acceptance criteria are narrow: run axe-core on the goal
    creation screen and fix any label, role, or accessible-name violations that affect
    the goal-type selector.

    - WHY not broader UX cleanup? Because the direction only authorizes remediation
    for violations affecting this selector, not a full-screen redesign.


    ## Acceptance Criteria from direction

    - Run axe-core on the goal creation screen.

    - Resolve any label, role, or name violations affecting the goal-type selector.


    ## Notes for implementation

    - Keep the slice tightly focused on observable accessibility failures tied to
    the selector.

    - Prefer an automated test or reproducible audit path so the fix remains guarded
    against regression.

    - If axe surfaces unrelated violations elsewhere on the screen, do not expand
    scope unless they block validating the selector itself.'
