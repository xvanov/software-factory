  tracker_title: D057 abuse controls for proof and verification endpoints
  tracker_body: '## Summary

    Direction D057 asks for abuse controls on proof and verification surfaces because
    unbounded JSON and downstream verification create a clear DoS path.


    ## Why / PM readout

    - WHY these endpoints first? They combine authenticated writes, potentially large
    user-controlled payloads, and downstream verification work.

    - WHY now? The app already treats bearer compromise and shared auth surfaces as
    high impact; proof and verification are adjacent high-cost execution paths.

    - WHY this matters to users? Legitimate users lose trust fast if proof submission
    or verification becomes slow or unavailable under abuse.


    ## Direction-stated acceptance criteria

    - Proof-related endpoints reject oversized or deeply nested payloads

    - External verification paths have explicit timeout and concurrency limits

    - Rate limiting or equivalent abuse controls protect public-facing API routes


    ## Delivery notes

    - `explore: true` provides sufficient backpressure, so implementation can proceed
    even though the exact per-route thresholds are not prescribed.

    - Keep slices small and vertical. Land guardrails incrementally rather than one
    broad backend bundle.

    - Sequence matters: payload guards should land before route-by-route adoption;
    verification limits should land before widening abuse controls to more routes.'
  child_stories:
  - title: D057 add JSON payload guard utility with depth/size tests
    scope: backend
    chain_kind: tdd
    rationale: WHY first? Every proof endpoint needs the same abuse gate, so start
      with one reusable guard plus tests that define oversized and deeply nested rejection
      behavior. This is the enabling abstraction for later route slices.
    estimated_new_files: 2
    estimated_modified_files: 1
    estimated_sandbox_iterations: 150
    points: 5
  - title: D057 apply payload guards to proof submission routes
    scope: backend
    chain_kind: tdd
    rationale: 'WHY separate? Route adoption is its own end-to-end slice: wire the
      new guard into proof-related submission endpoints and prove rejected requests
      return the expected failure path. Depends on the guard utility story landing
      first.'
    estimated_new_files: 1
    estimated_modified_files: 2
    estimated_sandbox_iterations: 140
    points: 3
  - title: D057 add timeout wrapper for external verification calls
    scope: backend
    chain_kind: tdd
    rationale: WHY isolate this? Explicit timeouts are one acceptance criterion and
      can land independently from rate limiting. This slice introduces the timeout
      behavior around downstream verification without bundling concurrency policy
      yet.
    estimated_new_files: 1
    estimated_modified_files: 2
    estimated_sandbox_iterations: 160
    points: 3
  - title: D057 cap concurrent external verification executions
    scope: backend
    chain_kind: tdd
    rationale: WHY not bundle with timeouts? Concurrency control has different failure
      modes and test setup. Land it as a separate slice so the chain can validate
      saturation behavior cleanly. Depends on understanding the verification execution
      path from the timeout slice.
    estimated_new_files: 1
    estimated_modified_files: 2
    estimated_sandbox_iterations: 180
    points: 5
  - title: D057 add abuse controls to public auth routes
    scope: backend
    chain_kind: tdd
    rationale: WHY auth routes first for public-facing API protection? Context already
      calls out visible rate-limiting gaps on login/register endpoints. This is a
      high-value vertical slice that satisfies part of the public-route abuse-control
      criterion with immediate security impact.
    estimated_new_files: 1
    estimated_modified_files: 2
    estimated_sandbox_iterations: 170
    points: 5
  - title: D057 add abuse controls to public OAuth entry/exchange routes
    scope: backend
    chain_kind: tdd
    rationale: WHY another slice? OAuth entry and code-exchange endpoints are also
      public-facing and abuse-sensitive, but they should not be bundled with email
      auth because the behavior and test fixtures differ. Lands after the first rate-limit
      mechanism exists.
    estimated_new_files: 1
    estimated_modified_files: 2
    estimated_sandbox_iterations: 170
    points: 3
