  details:
    resolution: infra-fix
    note: >-
      Original auto-diagnosis (Cloudflare WAF blocking auth POSTs) was WRONG.
      Real root cause: sacrifice.rentus.homes DNS CNAME pointed at the
      rental-mgmt tunnel (c0c37614, wildcard *.rentus.homes -> :3000 Next.js),
      so auth POSTs hit the rental app and got a blanket Next.js 400. Fixed by
      repointing the CNAME to the dedicated sacrifice tunnel
      (4f412527 -> :8000) via `cloudflared tunnel route dns -f <uuid>
      sacrifice.rentus.homes`. Verified: POST login->401, register->422 from
      the backend; sacrifice tunnel request count 0->42. Not a code change.
