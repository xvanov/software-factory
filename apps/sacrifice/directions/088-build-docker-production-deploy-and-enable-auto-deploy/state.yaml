  tracker_title: D088 Docker production deploy and factory auto-deploy
  tracker_body: '## Summary

    D088 builds the missing production deployment path for Sacrifice so merges to
    `main` can actually reach the live backend.


    ## Why this matters

    - Today the factory can merge code, but `deploy.enabled: false` means production
    never updates.

    - The config already points at Docker-based deploy artifacts that do not exist
    yet.

    - This creates a dangerous gap: auth/security fixes land on `main` while the public
    app keeps serving stale code.


    ## Requested outcome

    - Add the Docker production artifacts referenced by app config.

    - Make the health check path work with the deploy machinery.

    - Prove build/up/health/smoke/rollback behavior before turning on auto-deploy.

    - Only after that, flip `apps/sacrifice/config.yaml` to `deploy.enabled: true`.


    ## Acceptance criteria from direction

    - `docker compose -f docker-compose.prod.yml build && docker compose -f docker-compose.prod.yml
    up -d` brings up the full stack cleanly.

    - The configured health check passes after deploy; a failed health check triggers
    rollback, not a broken live app.

    - A merge to `main` results in the live backend (`localhost:8000`, reachable via
    `https://sacrifice.rentus.homes`) serving the merged code.

    - Mobile `POST /api/auth/email/login` and `/register` are verified against the
    freshly deployed backend; CSRF hardening must not break Expo Go mobile auth.

    - Deploy is idempotent and safe to re-run; `make smoke` gates the deploy.


    ## PM triage notes

    WHY split this? Because turning on deploy before proving health/rollback is how
    you brick prod. WHY avoid one giant infra story? Because Dockerfiles + compose
    + health route + rollback + config flip + mobile regression is too large for one
    dev sandbox. The safe sequence is: establish runnable images, establish compose
    orchestration, establish health compatibility, establish smoke/rollback proof,
    then enable factory deploy.


    ## Proposed story sequence

    1. Add backend production Docker image.

    2. Add production compose stack wired to backend and stateful services.

    3. Reconcile the configured health endpoint with the app''s actual health route.

    4. Add deploy rollback artifact/flow expected by config.

    5. Prove mobile auth smoke against deployed stack.

    6. Flip factory auto-deploy on once the above is verified.


    ## Risks / things to inspect

    - What currently serves `localhost:8000` and whether compose will replace or conflict
    with it.

    - Whether frontend artifacts are actually required for this direction or whether
    the live requirement is backend-only.

    - Whether Celery/Redis are mandatory for boot or optional; direction says include
    them as app requires.

    - Whether rollback should reuse previous compose file, previous image tags, or
    both.

    - Whether `make smoke` already exercises the required auth regression or needs
    deploy-aware wiring first.


    ## Definition of done for triage

    Spawn the stories below in order. Do not enable deploy until health-check + rollback
    + smoke are proven end-to-end.'
