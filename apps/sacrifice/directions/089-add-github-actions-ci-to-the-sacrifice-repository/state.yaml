  tracker_title: D089 add GitHub Actions CI to sacrifice repo
  tracker_body: "## Summary\nAdd first-party GitHub Actions CI to the `sacrifice`\
    \ repository so push/PR status is visible in GitHub and can back branch protection\
    \ with stable required checks.\n\n## Why\nToday there is no in-repo CI signal.\
    \ That means merges can rely on local confidence or out-of-band factory gates,\
    \ but GitHub itself cannot enforce server-visible pass/fail status before merge.\
    \ The direction is explicit about the failure mode: code looked green locally\
    \ or under mocked tests but failed under a real run. The fix is to make GitHub\
    \ run the same meaningful checks against the real repo state.\n\n## Requested\
    \ outcome\nCreate `.github/workflows/ci.yml` that runs on `push` and `pull_request`\
    \ to `main` with stable job names:\n- `lint`\n- `typecheck` (advisory only)\n\
    - `pytest`\n- `smoke`\n\nImplementation requirements from the direction:\n- Use\
    \ `astral-sh/setup-uv`\n- Use Python 3.12\n- `lint`: `cd backend && uv run ruff\
    \ check .` and `uv run ruff format --check .`\n- `typecheck`: `cd backend && uv\
    \ run mypy app`, but warning-only / non-blocking\n- `pytest`: `cd backend && uv\
    \ run --extra dev pytest -q tests/` with a real Postgres service\n- `smoke`: run\
    \ `make smoke` with a real backend + Postgres service, exercising the actual register\
    \ \u2192 login \u2192 create-goal \u2192 proof journey\n- Workflow must go green\
    \ on current `main` before merge\n\n## Acceptance criteria from direction\n- [\
    \ ] `.github/workflows/ci.yml` exists and runs on push + PR to main.\n- [ ] `lint`,\
    \ `pytest`, and `smoke` jobs pass on the current main of the sacrifice repo (verified\
    \ via a real Actions run before merge).\n- [ ] The `smoke` job boots a real backend\
    \ + Postgres service and exercises the real user journey (not mocked).\n- [ ]\
    \ `typecheck` runs as advisory (warning only), not a hard failure.\n- [ ] Job\
    \ names are stable (`lint`, `typecheck`, `pytest`, `smoke`) so branch protection\
    \ can require them.\n\n## PM cut-through / WHY notes\n- WHY one story first? Because\
    \ the highest-value increment is a workflow file that exists and runs visibly\
    \ in GitHub with the right job contract. Without that, nothing is enforceable.\n\
    - WHY separate hardening/fixup? Because the direction also demands a real green\
    \ run on current `main`, and that may require repo-specific command/env/service\
    \ adjustments discovered only after the first workflow exists. That is a distinct\
    \ dev-completable slice.\n- WHY not split by job (`lint`, `pytest`, `smoke`, etc.)?\
    \ Because there is only one workflow file and each job contributes to the single\
    \ branch-protection contract; slicing by isolated scope would create churn on\
    \ the same file without independently shippable value.\n\n## Risks / watchouts\n\
    - Advisory mypy in GitHub Actions must surface warning information without failing\
    \ the job or workflow.\n- `pytest` and `smoke` both depend on real Postgres wiring;\
    \ env, healthcheck, and service readiness need to match how the repo already boots\
    \ locally (`docker-compose.yml`, `scripts/smoke.sh`, `make smoke`).\n- The repo\
    \ context indicates not to manually start long-lived local servers during development,\
    \ but CI must still boot ephemeral processes correctly inside the job.\n- The\
    \ acceptance criterion requires a real green Actions run, so workflow syntax alone\
    \ is insufficient.\n"
  child_stories:
  - title: D089 create ci.yml with stable lint/typecheck/pytest/smoke jobs
