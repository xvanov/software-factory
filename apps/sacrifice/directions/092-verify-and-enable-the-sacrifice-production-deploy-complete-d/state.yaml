  tracker_title: D092 verify and enable sacrifice production deploy
  tracker_body: '## Summary

    D092 completes the last-mile verification that D088 explicitly did not finish:
    prove the production deploy artifacts actually build, boot, pass health checks,
    and serve the real smoke journey before enabling auto-deploy.


    ## WHY this exists

    - WHY are we touching this now? Because deploy artifacts landed on main in D088,
    but `deploy.enabled` is still false.

    - WHY is that still false? Because prior premature enablement caused a failing
    deploy and pushed the factory into fix-only mode.

    - WHY is the bar high here? Because a broken auto-deploy is worse than no auto-deploy.

    - WHY keep scope tight? Because the direction explicitly says deploy artifacts
    + config + verification only, with minimal diff and no app refactors.


    ## What must be proven

    1. `docker compose -f docker-compose.prod.yml build` and `up -d` succeed.

    2. `curl -fsS http://localhost:8000/healthz` passes against the deployed stack.

    3. The real smoke journey succeeds against the deployed backend: register -> login
    -> create-goal -> proof.

    4. Mobile auth routes `/api/auth/email/register` and `/api/auth/email/login` succeed
    against the deployed backend as a regression guard.

    5. `deploy.enabled=true` is changed ONLY if every verification step passes end-to-end.

    6. If any step fails, leave deploy disabled and record exactly what failed for
    operator review.


    ## Product/operational risk framing

    - High downside if enabled without proof: broken production automation, noisy
    failures, trust erosion in release flow.

    - Low upside in rushing: this is a gatekeeping verification task, not a feature
    launch.

    - Therefore the work should sequence conservatively: verify first, flip config
    second, and only conditionally.


    ## Decomposition logic

    This direction naturally splits into:

    - one slice to make verification executable/repeatable at the prod-compose layer,

    - one slice to codify the deployed smoke journey,

    - one slice to codify the deployed mobile auth regression guard,

    - one final slice to flip the factory config only after the previous proof exists
    and passes.


    ## Notes for downstream personas

    - Do not refactor application code unless a minimal deploy-artifact/config fix
    is required to satisfy the stated verification scope.

    - Treat the enablement flip as dependent on successful prior verification; if
    verification cannot be established, the config flip should not land.

    - Any failure path should preserve `deploy.enabled=false` and produce a clear
    operator-readable report in the record/PR context.

    '
