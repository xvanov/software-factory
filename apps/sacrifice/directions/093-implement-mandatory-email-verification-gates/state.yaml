  tracker_title: D093 implement mandatory email verification gates
  tracker_body: '## Summary

    Implement mandatory email verification gates for email/password accounts.


    ## Why

    Unverified identities reduce trust and increase abuse/fraud surface.


    ## PM triage

    - Type: security

    - Priority: p2

    - Backpressure: sufficient via `explore: true`

    - WHY this matters: bearer compromise is already high impact in this app, and
    email/password auth currently has a known hardening gap with no email verification
    flow.

    - WHY now: the direction defines the trust boundary change clearly enough to decompose
    into small slices.


    ## Acceptance criteria from direction

    - New email/password accounts are created in an unverified state

    - Sensitive actions are blocked until verification is completed

    - Verification tokens are single-use, expiring, and resend is rate-limited


    ## Key product questions being answered by the slices

    - WHY should account creation change first? Because verification state must exist
    before any gate can enforce it.

    - WHY isolate token mechanics? Because single-use + expiry is a security invariant
    and should land independently.

    - WHY isolate resend limiting? Because abuse prevention has different failure
    modes than token redemption.

    - WHY isolate blocking behavior? Because the app''s sensitive surfaces are broad,
    and the smallest shippable step is one shared enforcement path before expanding
    coverage.


    ## Delivery notes

    Stories are sequenced so the verification state exists first, token issuance/redemption
    lands next, resend abuse controls follow, and only then do sensitive-action gates
    become enforceable without guessing.

    '
  child_stories:
  - title: D093 add unverified email state on email/password signup
    scope: backend
    chain_kind: tdd
    rationale: WHY first? The system cannot gate anything until new email/password
      accounts persist a verification state. This is the foundational slice and should
      land before token or gate work.
    estimated_new_files: 1
    estimated_modified_files: 2
    estimated_sandbox_iterations: 140
    points: 3
  - title: D093 issue expiring single-use email verification tokens
    scope: backend
    chain_kind: tdd
    rationale: WHY separate token mechanics? Single-use and expiry are core security
      invariants and deserve an isolated slice with focused tests. Depends on the
      unverified-state slice existing.
    estimated_new_files: 2
    estimated_modified_files: 2
    estimated_sandbox_iterations: 180
    points: 5
  - title: D093 redeem verification token and mark account verified
    scope: backend
    chain_kind: tdd
    rationale: WHY its own slice? Redemption is the user-visible completion path and
      the point where single-use enforcement is proven. It should land independently
      after token issuance exists.
    estimated_new_files: 1
    estimated_modified_files: 2
    estimated_sandbox_iterations: 170
    points: 3
  - title: D093 rate-limit resend verification requests
    scope: backend
    chain_kind: tdd
    rationale: WHY not bundle with token issuance? Resend abuse control is a separate
      behavior with different edge cases and failure responses. Keeping it isolated
      reduces retry risk while satisfying the direction's anti-abuse requirement.
    estimated_new_files: 1
    estimated_modified_files: 2
    estimated_sandbox_iterations: 160
    points: 3
  - title: D093 gate one shared sensitive-action auth dependency
    scope: backend
    chain_kind: tdd
    rationale: WHY vertical slice instead of 'all sensitive routes'? The app has many
      authenticated surfaces. The smallest dev-completable slice is to enforce verification
      in one shared dependency or common gate used by sensitive actions, preserving
      end-to-end value without oversizing the story. Depends on verified-state and
      redemption slices.
    estimated_new_files: 1
    estimated_modified_files: 2
    estimated_sandbox_iterations: 190
    points: 5
  - title: D093 expose frontend handling for unverified-action blocks
    scope: frontend
    chain_kind: tdd
    rationale: WHY frontend at all? If the backend starts blocking sensitive actions,
      the client needs a minimal user-facing response path instead of failing opaquely.
      Keep this to handling the backend's unverified response and directing the user
      toward verification.
