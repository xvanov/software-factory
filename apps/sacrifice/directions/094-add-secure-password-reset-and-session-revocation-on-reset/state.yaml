  tracker_title: D094 secure password reset and session revocation
  tracker_body: '## Summary

    Direction D094 adds secure password recovery so compromised credentials can be
    rotated safely. WHY now: the app already treats bearer-token compromise as high
    impact across goals, payments, uploads, notifications, and dashboard access, and
    current context explicitly calls out the lack of a password reset flow as an auth
    hardening gap.


    ## User/problem framing

    - A legitimate user who forgets their password needs a recovery path.

    - An attacker must not learn whether an email exists from the forgot-password
    endpoint.

    - A stolen or replayed reset token must expire and be single-use.

    - A successful password reset must invalidate prior active sessions/tokens so
    compromise does not persist after recovery.


    ## Acceptance criteria from direction

    - Forgot-password issues expiring single-use reset tokens without disclosing account
    existence

    - Reset endpoint enforces token validity, complexity checks, and attempt throttling

    - Successful reset revokes prior active sessions/tokens


    ## PM decomposition notes

    WHY split this way: the risky part is not just adding endpoints; it is introducing
    a reset-token primitive, then wiring request flow, then wiring consume/reset behavior,
    then forcing session invalidation. Those are distinct vertical slices and fit
    the chain better as small PRs than one oversized auth rewrite.


    Suggested implementation order:

    1. Add reset-token persistence/validation primitive

    2. Add forgot-password request endpoint with account-enumeration protection

    3. Add reset-password consume endpoint with complexity + throttling

    4. Add session/token revocation on successful reset


    ## Risks / watchpoints

    - Do not leak account existence through status code, response body, or timing-sensitive
    branching where avoidable.

    - Revocation semantics must cover currently active bearer sessions, not just password
    change in storage.

    - Token single-use behavior must be explicit and testable.

    - Throttling needs an observable enforcement path for tests, not just comments
    or TODOs.'
