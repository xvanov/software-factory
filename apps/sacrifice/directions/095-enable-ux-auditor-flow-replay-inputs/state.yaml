  tracker_title: D095 enable UX auditor flow replay inputs
  tracker_body: '## Summary

    Enable the UX auditor to run against real flow narratives and a live browser session
    so scheduled audits return observed-step evidence instead of complaining about
    missing runtime inputs.


    ## Why / backpressure check

    - WHY now? The current auditor cannot validate friction if it lacks the user-flow
    narrative and a runnable app target.

    - WHY is this actionable? This direction carries `explore: true`, so it has sufficient
    backpressure even without sibling `flow.md` or `api_spec.md`.

    - WHY split it? There are at least three separable value slices: pass flow narratives
    into the invocation payload, provision a live browser-target URL, and verify scheduled
    runs emit evidence from observed steps.


    ## Acceptance criteria from direction

    - UX auditor invocation includes extracted flow.md files in its input payload.

    - UX auditor can access a live app URL in a browser-enabled sandbox and execute
    semantic Playwright locators against it.

    - A scheduled run returns evidence from observed steps rather than reporting missing
    runtime inputs.


    ## PM notes

    - The highest risk is hidden coupling between the auditor invocation path, sandbox/runtime
    provisioning, and scheduler output formatting.

    - The safest sequence is: first make flow narratives available to the auditor
    input, then make the runtime URL/browser session available, then prove the scheduled
    path reports observed evidence end-to-end.

    - Keep slices vertical and small; do not bundle all infra or all backend work
    into one oversized story.'
  child_stories:
  - title: D095 include extracted flow.md inputs in UX auditor payload
    scope: backend
    chain_kind: tdd
    rationale: WHY first? Without the flow narrative, the auditor still lacks the
