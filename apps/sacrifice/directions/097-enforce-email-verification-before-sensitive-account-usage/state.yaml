  tracker_title: D097 enforce email verification before sensitive usage
  tracker_body: '## Summary

    Direction D097: enforce email verification before sensitive account usage.


    ## Why

    Mailbox proof reduces fraudulent account creation and strengthens identity assurance.


    ## What matters

    - WHY gate new email/password accounts? Because bearer access to goals, payments,
    uploads, notifications, and related authenticated surfaces is high impact.

    - WHY now? Current context explicitly calls out no email verification as an auth
    hardening gap.

    - WHY not bundle this as one backend task? Because token issuance, redemption,
    and authorization enforcement are distinct slices with different failure modes
    and should land independently.


    ## Acceptance criteria from direction

    - New email/password accounts remain restricted until verification token is redeemed

    - Verification tokens are single-use, expiring, and cryptographically signed

    - Tests cover verified vs unverified authorization paths


    ## Proposed decomposition

    1. Add the verification token issue/redeem foundation for email/password accounts.

    2. Enforce verified-email checks on one sensitive authorization dependency/path
    so the restriction is real and testable.

    3. Expand enforcement to remaining sensitive account usage surfaces covered by
    shared auth dependencies.


    ## Risks / questions to validate during implementation

    - Which exact routes count as "sensitive account usage"? The context strongly
    suggests shared authenticated surfaces such as goals, payments, uploads, notifications,
    dashboard/chat-adjacent endpoints. Start at the shared auth dependency if possible
    to avoid route drift.

    - Verification UX/email delivery mechanism is not specified here. The security
    core is token issuance/redeem and gated authorization, not polished email product
    flow.

    - Existing OAuth users should not be unintentionally regressed; this direction
    is specifically about new email/password accounts.

    '
  child_stories:
  - title: D097 add signed single-use email verification token flow
    scope: backend
    chain_kind: tdd
    rationale: 'First vertical slice: create the core token lifecycle so new email/password
      accounts can be marked unverified, receive a redeemable verification token,
      and become verified only after redemption. WHY first? Because authorization
      gating is meaningless until there is a trusted state transition from unverified
      to verified. Keep this slice limited to token generation/redeem semantics and
      tests for signed, expiring, single-use behavior.'
    estimated_new_files: 3
