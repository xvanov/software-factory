  tracker_title: D098 secure password reset with session invalidation
  tracker_body: '## Summary

    Ship a secure password reset flow for Sacrifice so compromised users can recover
    access without leaking whether an email exists and so a successful reset evicts
    previously issued bearer sessions.


    ## Why

    - Account recovery is a core security requirement.

    - WHY generic responses? To prevent email/account enumeration on the reset request
    surface.

    - WHY single-use expiring tokens? To reduce replay and stale-link abuse.

    - WHY session invalidation on success? Because resetting the password is not enough
    if stolen bearer tokens remain valid across goals, payments, uploads, notifications,
    and related authenticated flows.


    ## Acceptance criteria from direction

    - Reset request/confirm endpoints use expiring single-use tokens with generic
    responses

    - Successful reset revokes existing sessions/bearers for that user

    - Tests verify token expiry, replay rejection, and anti-enumeration behavior


    ## Product/implementation notes

    - The repo context explicitly calls out password reset as an open auth hardening
    gap.

    - OAuth code-exchange behavior is already hardened; this direction is specifically
    about email/password recovery.

    - Keep slices vertical and small enough for one dev sandbox pass. Sequence matters:
    token/reset primitives first, then confirm flow, then explicit session invalidation
    coverage.

    '
  child_stories:
