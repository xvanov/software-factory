  tracker_body: '## Summary

    Direction D099 asks that UX auditor runs receive documented flow narratives so
    findings can be tied to concrete user steps instead of generic app-level observations.


    ## Why

    - WHY does this matter? Without flow narratives, the auditor lacks ordered task
    context.

    - WHY is that harmful? Findings become less empirical and less actionable because
    they cannot be mapped to a specific user journey step.

    - WHY now? The direction explicitly targets UX auditor input quality for the app.


    ## Acceptance Criteria

    - UX auditor input includes each `flow.md` filename and ordered step list for
    the target app.


    ## PM Notes

    - Backpressure is sufficient because `explore: true` is present.

    - The requested outcome appears to be pipeline/input-shaping work rather than
    app runtime UX changes.

    - Smallest valuable slice: add flow narrative payload assembly and cover it with
    a focused test so future auditor runs have step-specific context.'
