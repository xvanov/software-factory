  tracker_title: D100 wire-ux-auditor-to-live-browser-sandbox
  tracker_body: '## Summary

    Direction D100 asks to move the UX auditor off text-only wiring and onto a live
    browser sandbox so it can collect objective evidence instead of inferred commentary.


    ## Why / PM cut-through

    - WHY does this matter? Because the current setup cannot produce the evidence
    the UX schema requires.

    - WHY is browser access the core need? Because the acceptance criterion explicitly
    requires citations grounded in executable browser evidence: Playwright locator
    actions, response timings, or axe rule ids.

    - WHY not treat this as a single broad infra task? Because wiring runtime browser
    capability, proving evidence emission, and documenting the operating path are
    separate slices with different failure modes.


    ## Acceptance criteria from direction

    - ux_auditor runs with browser access and can emit findings citing Playwright
    locator actions, response timings, or axe rule ids.


    ## Notes / risks to watch

    - The repo context is app-focused, but this direction appears to target factory/runtime
    tooling around the UX auditor. The implementation should stay minimal and prove
    the observable outcome: audited findings include live-browser-backed citations.

    - The smallest shippable sequence is: enable browser-capable sandbox runtime,
    then prove the auditor emits compliant evidence, then document how to invoke/verify
    it.

    '
