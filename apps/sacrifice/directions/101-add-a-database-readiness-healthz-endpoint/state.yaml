  tracker_title: D101 add-a-database-readiness-healthz-endpoint
  tracker_body: "## Summary\nAdd a dedicated readiness endpoint at `GET /healthz/db`\
    \ that performs a trivial database round-trip and reports whether the app is actually\
    \ ready to serve traffic.\n\n## Why\nThe current health signal can say \"healthy\"\
    \ even when the database is unreachable. WHY does that matter? Because load balancers\
    \ and deploy gates keep sending traffic to an app that cannot fulfill core requests.\
    \ A DB-backed readiness check gives ops an honest signal for rollout, rollback,\
    \ and routing.\n\n## Direction evidence\n- `api_spec.md` defines the endpoint\
    \ contract.\n- Acceptance criteria specify:\n  - `200 {\"db\": \"ok\"}` when DB\
    \ is reachable\n  - `503 {\"db\": \"unreachable\"}` when the round-trip fails\n\
    \  - trivial read only (`SELECT 1`-style), no auth, no writes\n  - backend test\
    \ coverage for both paths\n\n## PM notes / backpressure check\n- WHY one story?\
    \ Because this is already the smallest useful vertical slice: one backend endpoint\
    \ plus its test coverage.\n- WHY no frontend/docs split? No user-facing client\
    \ change was requested, and no doc-only deliverable is required by the direction.\n\
    - WHY backend-only? The problem to solve is deploy/readiness truthfulness at the\
    \ API surface.\n\n## Acceptance criteria to verify downstream\n- `GET /healthz/db`\
    \ returns `200` with `{\"db\": \"ok\"}` when the database is reachable.\n- `GET\
    \ /healthz/db` returns `503` with `{\"db\": \"unreachable\"}` when the DB round-trip\
    \ fails.\n- The check performs only a trivial read and requires no auth.\n- Backend\
    \ tests cover both healthy and unreachable paths."
  child_stories:
  - title: D101 add GET /healthz/db readiness check with DB path tests
    scope: backend
    chain_kind: tdd
    rationale: 'Single vertical slice: implement the unauthenticated readiness endpoint,
      wire a trivial DB read (`SELECT 1` or equivalent), and prove both success and
      failure responses in backend tests. WHY keep this as one story? Because splitting
      endpoint code from its contract tests creates an incomplete slice with no independently
      shippable value, and the total surface should stay well within chain limits.'
    estimated_new_files: 1
