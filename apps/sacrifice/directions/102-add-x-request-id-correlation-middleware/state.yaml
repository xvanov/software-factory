  tracker_title: D102 add-x-request-id correlation middleware
  tracker_body: '## Summary

    Add global backend HTTP middleware so every response carries an `X-Request-ID`
    correlation header. WHY? Today requests cannot be traced across middleware, handlers,
    and failures, which makes debugging and support guesswork. The smallest user-visible
    win is simple and testable: echo a caller-supplied request id, generate a UUIDv4
    when absent, and ensure the header survives non-2xx responses including 404s.


    ## Direction signals

    - Type: feature

    - Priority: p2

    - Backpressure present via `api_spec.md`

    - Acceptance criteria are explicit and testable


    ## What must be true

    - Existing endpoints like `/healthz` return `X-Request-ID`

    - Caller-supplied `X-Request-ID` is echoed verbatim

    - Missing header causes UUIDv4 generation

    - Header is present on non-2xx responses, including 404

    - Backend tests cover echo, generation, and 404 presence


    ## WHY this is one slice

    This is already a dev-sized vertical slice: one middleware plus one focused backend
    test file/update. Splitting further would create artificial scope groups with
    no standalone user value.

    '
