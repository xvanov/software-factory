  tracker_title: D104 enable executable UX audit target for camera proof flow
  tracker_body: '## Summary

    Direction D104 asks for an executable UX audit target for the camera proof flow.


    ## Why this matters

    The current audit setup cannot validate the documented camera permission and upload
    states against a running app. The flow explicitly calls out that the app URL is
    unavailable in runtime context (`Deploy: disabled`) and the scheduler transport
    is `text_run`, so the permission-denied branch cannot be exercised with observable
    UI evidence.


    ## Backpressure check

    - `flow.md` exists and is non-empty: yes

    - Acceptance criteria present: yes

    - `explore: true`: yes


    ## What is actually needed

    WHY can''t the audit run today? Because there is no live target the audit can
    open.

    WHY does that block confidence? Because the required evidence is UI-observable
    behavior in a browser/mobile sandbox, not static documentation.

    WHY is this direction likely infra-heavy? Because the requested outcome depends
    on provisioning a stable executable target path or deploy URL, then proving the
    audit harness can reach it and execute the camera proof branches.


    ## Acceptance criteria from direction

    - UX audit can open the app in a live browser/mobile sandbox and execute the camera
    proof flow branches with observable UI evidence.


    ## Notes for decomposition

    This should be split into small vertical slices. First establish a runnable target,
    then wire the audit path against that target, then document how auditors should
    invoke it. Do not bundle all deployment, harness, and docs work into one oversized
    story.'
