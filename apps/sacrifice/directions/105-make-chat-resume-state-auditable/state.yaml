  tracker_title: D105 make-chat-resume-state-auditable
  tracker_body: '## Summary

    Make the documented chat resume behavior empirically observable in the scheduled
    UX audit runtime.


    ## Why

    The direction is explicit about the failure mode: the audit runtime can leave
    the chat flow and return later, but today it cannot verify whether the session
    resumes from the last assistant message because persisted local session state,
    navigation state, and restored assistant state are not observable under `text_run`.


    ## Acceptance Criteria

    - Scheduled UX audit can leave the chat flow, return later, and verify the session
    resumes from the last assistant message with objective evidence.


    ## Evidence from flow

    - Flow: `009-chat-goal-creation/flow.md`

    - Step: `6`

    - Current gap: under `text_run` without a live app session, the resume-on-return
    requirement could not be verified.

    - Suggested direction: add a runnable audit target or scripted fixture that exposes
    persisted chat-session state so resume behavior can be checked empirically.


    ## PM triage notes

    - WHY does this matter? Because a documented UX promise that cannot be observed
    in audit is not a controlled product behavior.

    - WHY is this a UX-classified change rather than pure test work? Because the user-facing
    behavior already exists conceptually; the missing piece is auditable evidence
    of persisted resume state.

    - WHY split this? Because one slice should expose deterministic resume-state evidence,
    and a separate slice should teach the scheduled audit to consume that evidence.
    Bundling both would risk an oversized, cross-cutting story.


    ## Delivery shape

    Sequence matters:

    1. Expose auditable persisted chat resume state in a runnable target/fixture.

    2. Update the scheduled UX audit to leave and return, then assert resume from
    the last assistant message using objective evidence.

    '
