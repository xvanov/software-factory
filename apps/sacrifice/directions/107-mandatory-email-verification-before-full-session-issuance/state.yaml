    chain_kind: tdd
    rationale: Second slice. WHY separate from state? Because issuing the initial
      restricted session is an end-to-end behavior change on its own and can land
      once verification state exists. This should cover the registration route behavior
      without bundling token verification or route gating.
    estimated_new_files: 1
    estimated_modified_files: 2
    estimated_sandbox_iterations: 160
    points: 3
  - title: D107 add single-use expiring email verification token issuance
    scope: backend
    chain_kind: tdd
    rationale: Third slice. WHY isolate issuance? Token generation, storage, expiry
      semantics, and auditability are a distinct security surface. This slice should
      create the token lifecycle foundation without also consuming it in the verification
      endpoint.
    estimated_new_files: 3
    estimated_modified_files: 2
    estimated_sandbox_iterations: 190
    points: 5
  - title: D107 verify email via token and mark tokens consumed
    scope: backend
    chain_kind: tdd
    rationale: Fourth slice. WHY separate consume from issuance? Single-use enforcement
      is where replay bugs happen. This PR should prove valid token redemption flips
      the account to verified, records auditable use, and rejects replay/expired tokens
      with clear backend semantics.
    estimated_new_files: 1
