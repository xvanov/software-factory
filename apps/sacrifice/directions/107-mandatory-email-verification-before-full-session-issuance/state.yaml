  tracker_title: D107 mandatory email verification before full session issuance
  tracker_body: '## Summary

    D107: Mandatory email verification before full session issuance.


    ## Why

    Unverified accounts undermine identity trust and recovery security.


    ## PM triage

    - Type: security

    - Priority: p2

    - Backpressure is sufficient because `explore: true` is present.

    - WHY this matters: bearer tokens already unlock high-impact surfaces across goals,
    payments, uploads, notifications, dashboard data, and chat-adjacent flows. Letting
    a newly registered email/password account receive a full session before email
    ownership is proven weakens trust, recovery, and abuse controls.


    ## Acceptance criteria from direction

    - New email/password accounts remain restricted until verification

    - Verification token is single-use, time-bounded, and auditable

    - Protected routes reject unverified sessions with clear error semantics


    ## Product decomposition notes

    - WHY split this? Because "email verification" is not one change. It contains
    at least three separable outcomes: issuing a restricted session at registration,
    proving email ownership through a single-use expiring token, and enforcing verified-only
    access on protected routes.

    - WHY this order? The restricted-session/session-state slice must land before
    route enforcement has meaning. Verification token lifecycle should land before
    the account can transition out of restricted state.

    - WHY no frontend story yet? The direction is security-focused and the acceptance
    criteria only require server-observable behavior. If UX copy or client handling
    becomes mandatory, that should be a follow-up direction or iteration.

    '
  child_stories:
