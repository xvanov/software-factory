    scope: backend
    chain_kind: tdd
    rationale: First vertical slice. WHY first? The system needs a durable notion
      of verified vs unverified before registration/login behavior can safely branch.
      This should introduce the minimal persistence/state and prove via tests that
      new email/password accounts start restricted rather than fully trusted.
    estimated_new_files: 2
