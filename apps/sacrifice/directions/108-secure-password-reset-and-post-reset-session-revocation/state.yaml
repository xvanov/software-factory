  tracker_title: D108 secure password reset and session revocation
  tracker_body: "## Summary\nDirection D108 targets account-recovery hardening for\
    \ Sacrifice. WHY: bearer compromise is high impact across goals, payments, uploads,\
    \ dashboard, and notifications, so password recovery must not leak account existence,\
    \ reset tokens must be constrained, and a successful reset must cut off existing\
    \ access.\n\n## Direction signals\n- `explore: true` provides sufficient backpressure\
    \ for downstream work.\n- Acceptance criteria provided:\n  - Password reset requests\
    \ return non-enumerating responses\n  - Reset token is single-use, expiring, and\
    \ invalidated on success\n  - All active sessions are revoked after password reset\n\
    \n## PM readout / decomposition logic\nWHY split this way instead of one \"backend\
    \ auth hardening\" blob? Because password reset has at least three separable risk\
    \ boundaries:\n1. request-time enumeration behavior,\n2. token issuance/verification/consumption\
    \ lifecycle,\n3. session invalidation after successful reset.\n\nEach slice can\
    \ land independently, stays within chain size limits, and preserves a meaningful\
    \ vertical increment toward the stated security outcome.\n\n## Expected sequencing\n\
    1. Land the non-enumerating request flow first so recovery entrypoint behavior\
    \ is safe.\n2. Land reset-token persistence/consumption semantics next so the\
    \ reset itself is trustworthy.\n3. Land post-reset session revocation last so\
    \ successful resets terminate existing authenticated access.\n\n## Notes / open\
    \ product questions for implementation\n- Direction does not prescribe delivery\
    \ channel details (email transport, UI copy, exact HTTP payload shape), so dev\
    \ should minimize change scope to the observable acceptance criteria.\n- \"All\
    \ active sessions\" should be implemented against all bearer sessions the backend\
    \ currently honors, including locally persisted frontend/CLI tokens if they remain\
    \ valid server-side after issuance. WHY: revoking only one client would fail the\
    \ stated criterion.\n"
  child_stories:
  - title: D108 add non-enumerating password reset request flow
    scope: backend
    chain_kind: tdd
    rationale: Vertical slice for the first acceptance criterion. WHY first? The public-facing
      recovery entrypoint is the enumeration surface. Scope should cover request endpoint
      behavior and tests proving the same outward response whether the account exists
      or not.
    estimated_new_files: 1
    estimated_modified_files: 2
    estimated_sandbox_iterations: 140
    points: 3
  - title: D108 implement single-use expiring reset token lifecycle
    scope: backend
    chain_kind: tdd
    rationale: Vertical slice for reset-token correctness. WHY separate? Token generation/storage/expiry/consumption
      is its own trust boundary and likely introduces a new model or service plus
      route changes. Include success-path invalidation and tests that consumed or
      expired tokens cannot be reused. This should land before session revocation
      because revocation only matters after a trustworthy reset succeeds.
    estimated_new_files: 2
    estimated_modified_files: 2
    estimated_sandbox_iterations: 190
    points: 5
  - title: D108 revoke all active sessions after password reset
    scope: backend
    chain_kind: tdd
    rationale: Vertical slice for the final acceptance criterion. WHY separate? Session
      invalidation semantics are distinct from reset-token semantics and may touch
      auth dependencies/token validation paths. Scope should prove that tokens issued
      before reset no longer authorize requests after a successful password reset.
    estimated_new_files: 1
    estimated_modified_files: 2
    estimated_sandbox_iterations: 180
    points: 5
