  tracker_title: 'D111 sign-in coverage: Playwright e2e + auth unit tests'
  tracker_body: '## Summary

    Add regression coverage for sign-in because auth breaks have shipped and blocked
    deploys. The direction explicitly asks for two kinds of coverage: (1) a Playwright
    e2e that drives Google and GitHub sign-in against a deployed instance and proves
    the user reaches an authenticated end state, and (2) local unit coverage for the
    frontend auth redirect/exchange logic.


    ## Why this matters

    Bearer-token auth is a high-impact surface in Sacrifice. A broken sign-in path
    blocks every downstream goal, payment, notification, upload, and dashboard flow.
    We need earlier detection both at the user-journey layer and at the redirect/exchange
    unit layer.


    ## Backpressure check

    Sufficient backpressure is present because `explore: true` is set in frontmatter.


    ## Requested outcomes

    - Add a Playwright e2e spec for Google and GitHub sign-in that asserts authenticated
    end state.

    - Add/expand unit tests for `handleRedirectCallback` covering `auth_code`, `access_token`,
    and `error` params, plus `exchangeCode` success and failure.

    - Make the e2e target actually runnable against the deployed base URL by wiring
    `gates.e2e_harness_ready` true or documenting a runner path.

    - Ensure sign-in unit coverage runs in CI when `frontend/services/auth.ts` or
    `frontend/hooks/useAuth.tsx` changes.


    ## PM decomposition notes

    WHY split this? Because "add all sign-in coverage" is not a single dev-sized slice.
    The deployed Playwright path, the unit-path assertions, and the CI/runnable harness
    each have different failure modes. Landing them separately gives us value sooner
    and reduces retry churn.


    Recommended order:

    1. Unit coverage for redirect/exchange logic.

    2. CI wiring for those unit tests.

    3. Runnable e2e harness against deployed base URL.

    4. Google sign-in Playwright flow.

    5. GitHub sign-in Playwright flow.


    ## Risks / open questions to resolve during implementation

    - The direction allows either mocked providers or documented test credentials.
    Which path is lower-friction in the current deployed environment should be chosen
    during implementation, but the resulting spec must still prove an authenticated
    end state.

    - `gates.e2e_harness_ready` is currently false, so the e2e slice must first make
    the runner path real before provider-flow specs can be dependable.

    - Keep stories vertical and small: one provider flow per PR rather than one oversized
    "all e2e auth" bundle.

    '
