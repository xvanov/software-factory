  tracker_title: D112 auto-redeploy on main merge for deployed==main
  tracker_body: "## Summary\nDirection D112 asks for host-level auto-redeploy so the\
    \ deployed Sacrifice instance tracks `origin/main` without manual steps. WHY:\
    \ deploy drift means local != remote != deployed today, which is exactly how teams\
    \ ship confusion and stale fixes. The requested mechanism must fast-forward `/home/k/sacrifice`\
    \ only when `origin/main` genuinely advances, restart the four `systemd --user`\
    \ services (`sacrifice-backend`, `sacrifice-frontend`, `sacrifice-celery`, `sacrifice-expo-go`),\
    \ gate success on `curl -fsS http://localhost:8000/healthz`, alert on failure,\
    \ and log actions. It must also be documented, including trigger mode and disable\
    \ procedure, and verified once end-to-end.\n\n## Why this matters\n- Manual deploy\
    \ means production can lag behind main indefinitely.\n- Drift breaks trust in\
    \ debugging because code under test is not code in prod.\n- Auth-hardening work\
    \ in this repo raises the cost of stale deploys; undeployed fixes are fake fixes.\n\
    \n## Acceptance criteria from direction\n- When `origin/main` advances, the host\
    \ checkout fast-forwards to `origin/main` with no manual step and restarts the\
    \ four `sacrifice-*` user services.\n- After restart, `curl -fsS http://localhost:8000/healthz`\
    \ must pass; on failure the deploy alerts and does not leave services broken.\n\
    - The mechanism is idempotent: no restart when already at `origin/main`, and each\
    \ action is logged.\n- Documentation explains trigger mode (poll timer or webhook)\
    \ and how to disable it.\n- Verified end-to-end once: a commit merged to main\
    \ is what runs on the deployed instance without manual intervention.\n\n## PM\
    \ cut-through / decomposition logic\nWHY split this? Because \u201Cset up auto\
    \ deploy\u201D sounds small until it quietly spans detection, deploy execution,\
    \ failure behavior, service wiring, and docs. One oversized infra blob will stall.\
    \ The smallest reviewable slices are:\n1. Detect real main advancement and do\
    \ nothing when already current.\n2. Execute fast-forward + service restart + health\
    \ gate + logging/alert path.\n3. Wire host trigger so it runs automatically on\
    \ a cadence.\n4. Document trigger/disable/ops verification separately.\n5. Add\
    \ end-to-end verification evidence path separately.\n\n## Risks / questions to\
    \ keep visible\n- The direction allows poll timer or webhook; poll timer is lower-friction\
    \ on a single host and matches the acceptance criteria.\n- \u201CDoes not leave\
    \ services broken\u201D needs concrete failure handling in the implementation\
    \ slice; at minimum the script must fail loudly after health-check failure and\
    \ preserve actionable logs/alerting.\n- \u201CAlert\u201D mechanism is not specified.\
    \ Use the host\u2019s simplest existing observable path if one exists; if not,\
    \ the implementation must at least emit a clear failure signal in logs/journal\
    \ and document the alerting behavior chosen.\n\n## Proposed story order\n1. Detection/idempotency\
    \ script skeleton.\n2. Deploy executor with restart + health gate + failure signaling.\n\
    3. `systemd --user` timer/service wiring to run automatically.\n4. Ops docs for\
    \ trigger and disable flow.\n5. End-to-end verification artifact/update proving\
    \ deployed tracks main.\n"
  child_stories:
