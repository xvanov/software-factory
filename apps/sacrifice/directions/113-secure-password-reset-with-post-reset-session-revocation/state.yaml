  - title: D113 add reset request endpoint with non-enumerating 202 response
    scope: backend
    chain_kind: tdd
    rationale: 'Vertical user-visible value: clients can begin the reset flow safely.
      WHY separate: request-path non-enumeration is a distinct security behavior and
      should not be bundled with confirm-path password mutation. For known emails
      the route triggers token minting internally; for unknown emails it still returns
      202 and never leaks token material.'
    estimated_new_files: 1
