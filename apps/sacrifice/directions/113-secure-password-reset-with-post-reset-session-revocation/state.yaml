  tracker_title: D113 secure password reset with session revocation
  tracker_body: '## Summary

    Implement a secure email/password reset flow for Sacrifice without adding email
    delivery yet. WHY now: users with forgotten passwords are locked out today, and
    auth tokens are high-impact across goals, payments, uploads, notifications, and
    related surfaces. The direction is explicit that reset delivery is out of scope
    for this iteration; the work is backend-only and must be exercised directly in
    tests.


    ## What the direction requires

    - Add `POST /api/auth/password/reset/request` that always returns `202 Accepted`
    for both known and unknown emails.

    - Never return the reset token in the request response body.

    - Mint a short-TTL (`<=30m`), purpose-scoped, single-use reset token for known
    users only.

    - Add `POST /api/auth/password/reset/confirm` that validates token signature,
    purpose, expiry, and single-use semantics.

    - Enforce the same password policy as registration.

    - On successful reset, update the password hash and rotate `auth_session_id` so
    all existing JWTs/sessions are revoked.

    - Return `400` for invalid, expired, or reused reset tokens.

    - Cover the required backend test cases: happy path, unknown-email non-enumeration,
    reused token, expired token, wrong-purpose token, weak password, and post-reset
    session revocation.


    ## Product / security reasoning

    - WHY always `202` on request: avoid user enumeration.

    - WHY purpose-scoped token: a csrf/access token must never be replayed as a reset
    token.

    - WHY single-use + jti: reset links are high-risk and must burn after first success.

    - WHY rotate `auth_session_id`: password reset is not complete if stolen bearer
    tokens remain valid.

    - WHY split this work: route plumbing, token semantics, and revocation/testing
    are distinct failure domains; small slices reduce retry churn.


    ## Out of scope

    - Email sending infrastructure.

    - Returning the raw reset token from the request endpoint.

    - Frontend reset UX.


    ## Acceptance criteria from direction

    - `POST /api/auth/password/reset/request` returns 202 for BOTH a known and an
    unknown email (no user enumeration), and never returns the reset token in the
    response body.

    - A valid single-use reset token lets `POST /api/auth/password/reset/confirm`
    set a new password; the old password no longer authenticates and the new one does.

    - Confirming a reset ROTATES `auth_session_id` so a JWT/session issued before
    the reset is rejected afterward (session revocation).

    - A reset token is single-use (a second confirm with the same token is 400), expires
    (`<=30m`), and is purpose-scoped (a csrf/access token cannot be used as a reset
    token).

    - New password must satisfy the same policy as registration; a weak password is
    rejected 400/422.

    - Backend unit tests cover: happy path, unknown-email non-enumeration, reused
    token, expired token, wrong-purpose token, weak password, and post-reset session
    revocation.


    ## Notes for implementation sequencing

    The token contract/service should land before confirm-route enforcement. Request-route
    non-enumeration can land independently once minting exists. Revocation behavior
    should be verified after confirm succeeds.'
  child_stories:
  - title: D113 add password reset token service with single-use claims
    scope: backend
    chain_kind: tdd
    rationale: 'Foundational slice. WHY first: every later route depends on a purpose-scoped
      reset token contract. Implement mint/validate/consume semantics for short-TTL
      password reset tokens, including purpose and jti handling, with focused service
      tests. Keep this slice below size limits by stopping at the service boundary
      rather than adding both endpoints here.'
    estimated_new_files: 2
