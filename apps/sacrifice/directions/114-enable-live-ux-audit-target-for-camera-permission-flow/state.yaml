  tracker_title: D114 enable live UX audit target for camera permission flow
  tracker_body: '## Summary

    Enable a stable live audit target so scheduled UX audits can actually exercise
    the camera-permission-denied branch during proof submission.


    ## Why

    The direction is explicit: today the runtime cannot observe the documented permission-denied
    path for `Record proof`, which means a core proof-submission UX branch is unaudited.
    WHY does this matter? Because proof submission is the product''s trust path, and
    an untestable denial branch means regressions can ship unnoticed.


    ## Backpressure check

    - `flow.md` present: yes

    - `api_spec.md` present: no

    - `explore: true`: yes


    Backpressure is sufficient.


    ## Acceptance criteria from direction

    - A scheduled UX audit can open the app, trigger Record proof, deny camera permission,
    and verify the expected error text plus Open settings and Cancel actions.


    ## PM notes

    - WHY is this a deploy/infra-shaped UX task rather than pure frontend? Because
    the documented UX already exists; the stated gap is that scheduled audits cannot
    replay it against a running target.

    - WHY split this into two stories? Because provisioning a live audit target and
    then proving the audit scenario runs against it are separable vertical slices.
    The first creates the observable environment; the second delivers the actual camera-permission-denied
    audit coverage.

    - Keep slices small: no broad environment refactor, no unrelated auth/deploy work,
    no speculative copy changes unless the audit proves the current UI is wrong.

    '
