  tracker_title: D115 make chat resume state observable to UX audit
  tracker_body: '## Summary

    WHY does this exist? Because the UX audit currently cannot prove interrupted goal-creation
    chats actually resume. The gap is not theoretical; the audit already failed to
    observe persisted session state, restored assistant output, or draft recovery
    after leaving and returning.


    This direction asks for an auditable, empirical resume path for the goal-creation
    chat so an auditor can leave mid-flow, come back later, and verify two concrete
    things:

    - the last assistant message is restored

    - the in-progress draft state is restored


    ## Direction signals

    - Type: ux

    - Priority: p2

    - Backpressure present via `flow.md`

    - Acceptance criteria are testable as written because they specify an observable
    leave/return flow and concrete restored state


    ## What matters

    WHY not treat this as a generic "chat persistence" epic? Because the user value
    here is narrower: make resume behavior observable to a scheduled UX audit with
    a live persisted session or runnable audit fixture. Smallest shippable validation
    wins.


    ## Expected decomposition logic

    WHY split this? Because one oversized "make chat resumable" story would likely
    cross frontend state, persistence, routing, and audit verification in a single
    pass. Better sequence:

    1. establish a persisted resume fixture/path that can be inspected

    2. restore assistant message from persisted session

    3. restore draft state on return

    4. add an audit-focused regression check proving leave/return behavior


    ## Acceptance criteria from direction

    - A scheduled UX audit can leave the chat mid-flow, return later, and confirm
    the last assistant message and draft state are restored.

    '
  child_stories:
  - title: D115 persist goal-chat session snapshot for resume
    scope: frontend
    chain_kind: tdd
    rationale: WHY first? There is nothing to restore unless the app writes an auditable
      session snapshot when the user leaves mid-flow. This slice should introduce
      the minimal persisted chat session shape needed for later resume behavior without
      bundling full UI restoration.
    estimated_new_files: 2
    estimated_modified_files: 2
    estimated_sandbox_iterations: 150
    points: 5
  - title: D115 restore last assistant message on chat re-entry
    scope: frontend
    chain_kind: tdd
    rationale: WHY separate this from persistence? Because restoring the visible assistant
      message is one user-visible vertical slice the audit explicitly needs to inspect.
      It depends on the persisted snapshot story landing first.
    estimated_new_files: 1
    estimated_modified_files: 2
    estimated_sandbox_iterations: 140
    points: 3
  - title: D115 restore in-progress draft state on chat re-entry
    scope: frontend
    chain_kind: tdd
    rationale: WHY its own slice? Draft recovery is distinct from assistant-message
      recovery and can regress independently. The audit needs both, but each should
      be landable and testable as its own PR. Depends on persisted snapshot support.
    estimated_new_files: 1
    estimated_modified_files: 2
    estimated_sandbox_iterations: 150
    points: 3
  - title: D115 add audit regression for leave-and-return chat resume
    scope: test
    chain_kind: tdd
    rationale: WHY not rely on manual checking alone? Because the requirement came
      from an audit failure. This slice should codify the observable leave/return
      behavior so future regressions are caught. Sequence this after both restore
      slices land.
    estimated_new_files: 2
