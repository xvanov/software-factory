  tracker_title: 'D001 item-count-endpoint: org-scoped item counts on dashboard'
  tracker_body: '## Summary

    Add an org-scoped `items.count` tRPC query returning `{ total, open, done }` and
    surface the counts in the web dashboard''s Items card.


    ## WHY

    - Users currently have to count by eye once the list exceeds one screen.

    - The smallest trustworthy tenant-health signal is a count that proves the API
    is scoped to the caller''s workspace.

    - WHY does this matter technically? Because cross-tenant count leakage is explicitly
    worse than no count.


    ## Direction anchors

    - Router: `packages/api/src/routers/items.ts`

    - Procedure: `items.count`

    - Must be `orgProcedure`

    - Must filter on `ctx.organizationId`

    - No schema change, no migration, no new route file

    - Web dashboard only


    ## Acceptance criteria from direction

    - `items.count` returns `{total, open, done}` for the caller''s workspace only.

    - A second workspace''s items never affect the first workspace''s numbers.

    - The counts appear on the dashboard and update after adding, completing or deleting
    an item.

    - The existing end-to-end journey still passes.


    ## Out of scope

    - Counting anything other than items.

    - Mobile app changes.

    - Pagination or filtering.


    ## Decomposition logic

    WHY split this into two slices instead of one? Because the API contract and tenant
    isolation are one independently shippable value slice, and the dashboard rendering/reactivity
    is a separate end-user slice. That keeps each child within the chain''s file and
    iteration budget and avoids handing dev a bundled backend+frontend change that
    is harder to land in one pass.'
  child_stories:
  - title: D001 add org-scoped items.count query with tenant isolation tests
